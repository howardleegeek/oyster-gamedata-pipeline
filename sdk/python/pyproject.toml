[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "oyster-gamedata-sdk"
version = "0.1.0"
description = "Buyer-facing Python SDK for the Oyster GameData buyer-spec v1 tarball format."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [
    { name = "Oysterworld INC", email = "howard.linra@gmail.com" },
]
keywords = ["world-model", "game-data", "buyer-sdk", "ml-data", "openexr"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: Other/Proprietary License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Core SDK has ZERO required deps — pure stdlib parsing works for
# systeminfo.json + action_camera.json + structural validation. Anything
# heavier (XLSX, EXR, video decoding) is pulled in via extras and lazy-loaded.
dependencies = []

[project.optional-dependencies]
xlsx = ["openpyxl>=3.1"]
exr = ["OpenEXR>=3.0", "numpy>=1.26"]
video = ["opencv-python>=4.8"]
full = [
    "openpyxl>=3.1",
    "OpenEXR>=3.0",
    "numpy>=1.26",
    "opencv-python>=4.8",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "openpyxl>=3.1",
    "OpenEXR>=3.0",
    "numpy>=1.26",
]

[project.urls]
Homepage = "https://github.com/howardleegeek/oyster-gamedata-pipeline"
Documentation = "https://github.com/howardleegeek/oyster-gamedata-pipeline/blob/main/docs/BUYER_SDK_QUICKSTART.md"
Issues = "https://github.com/howardleegeek/oyster-gamedata-pipeline/issues"

[project.scripts]
oyster-gamedata = "oyster_gamedata_sdk.cli:main"

[tool.setuptools]
packages = ["oyster_gamedata_sdk"]

[tool.setuptools.package-data]
oyster_gamedata_sdk = ["py.typed"]
