name: Build QA Validator EXE

# Builds bin/qa_validator_gui.py into a single Windows .exe via PyInstaller.
# Triggered on tags `qa-validator-v*` (auto-attaches to GitHub Release) or
# manually via workflow_dispatch (artifact only). Non-programmer testers
# download the .exe from the release page and double-click it — no Python,
# no pip, no terminal.

on:
  push:
    tags:
      - 'qa-validator-v*'
  workflow_dispatch:

permissions:
  contents: write   # needed for softprops/action-gh-release to attach asset

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pillow numpy pyyaml

      - name: Build windowed .exe (PyInstaller)
        # --onefile           : single .exe, no __pycache__ side files
        # --windowed          : no console window flashes (it's a GUI)
        # --name              : output filename
        # --paths bin         : let PyInstaller resolve `import lint_v3_prd_grounded`
        # --collect-all       : bundle ALL submodules + DLLs of these packages.
        #                       Stronger than --hidden-import; required for
        #                       numpy MKL DLLs and PIL C extensions, which
        #                       were missed by the v0.1.0 build and caused
        #                       silent startup-flash with no error visible.
        # --hidden-import     : keep belt-and-suspenders for lint module +
        #                       PIL.Image (some versions need it explicitly)
        # --add-data          : also bundle the .py source so module is findable
        run: |
          pyinstaller --onefile --windowed `
            --name OysterClipValidator `
            --paths bin `
            --collect-all numpy `
            --collect-all PIL `
            --collect-all yaml `
            --collect-all tkinter `
            --hidden-import lint_v3_prd_grounded `
            --hidden-import PIL.Image `
            --add-data "bin/lint_v3_prd_grounded.py;." `
            bin/qa_validator_gui.py

      - name: Build console-mode diagnostic .exe
        # Identical to the windowed build EXCEPT:
        #   - no --windowed flag (so a console window opens, exposing
        #     Python tracebacks that --windowed otherwise swallows)
        #   - different --name so both .exes coexist in dist/
        # Engineers / Howard ship this one to a tester only when the
        # main .exe fails silently and we need a visible traceback.
        run: |
          pyinstaller --onefile `
            --name OysterClipValidator-Diag `
            --paths bin `
            --collect-all numpy `
            --collect-all PIL `
            --collect-all yaml `
            --collect-all tkinter `
            --hidden-import lint_v3_prd_grounded `
            --hidden-import PIL.Image `
            --add-data "bin/lint_v3_prd_grounded.py;." `
            bin/qa_validator_gui.py

      - name: Verify build output
        run: |
          dir dist
          if (-not (Test-Path dist/OysterClipValidator.exe)) {
            Write-Error "Windowed build artifact missing"
            exit 1
          }
          if (-not (Test-Path dist/OysterClipValidator-Diag.exe)) {
            Write-Error "Diagnostic build artifact missing"
            exit 1
          }

      - name: Upload as workflow artifact (always)
        uses: actions/upload-artifact@v4
        with:
          name: OysterClipValidator-windows
          path: |
            dist/OysterClipValidator.exe
            dist/OysterClipValidator-Diag.exe
          if-no-files-found: error

      - name: Attach to GitHub Release (tag push only)
        if: startsWith(github.ref, 'refs/tags/qa-validator-v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/OysterClipValidator.exe
            dist/OysterClipValidator-Diag.exe
          generate_release_notes: true
          body: |
            ## What this is
            Single-file Windows .exe for **non-programmer testers** to validate
            recorded gameplay clips against the Lark PDF buyer-spec
            (24 PRD acceptance criteria, G165 lint v3).

            ## How testers use it (the normal path)
            1. Download **`OysterClipValidator.exe`** from the **Assets** below.
            2. Double-click it. (No installer; no admin; no Python.)
            3. If Windows shows "Windows protected your PC" / SmartScreen,
               click **More info** then **Run anyway** — the .exe is unsigned,
               which is expected for now.
            4. Click **Choose Clip...** and pick a `clip-YYYYMMDD-HHMMSS.tar.gz`.
            5. Read the green / red banner. If red, the per-criterion list
               below the banner says exactly which checks failed.

            ## If the normal .exe fails silently
            Download **`OysterClipValidator-Diag.exe`** instead. It opens a
            black console window in addition to the GUI; any Python error
            shows up there in plain text. Screenshot the console and send it
            to engineering — that gives us the traceback we need to fix it.

            ## Engineer triage
            If a tester reports a red verdict, ask for a screenshot of the
            detail panel and the clip filename. Engineers can run the same
            lint locally with:
            ```
            python3 bin/lint_v3_prd_grounded.py <extracted-clip-dir>
            ```
            and reproduce the failure offline.

            ## v0.1.1 changes from v0.1.0
            - `--collect-all numpy / PIL / yaml / tkinter` (was `--hidden-import`):
              bundles all DLLs and submodules; fixes silent startup-flash
              when numpy MKL or PIL C-extensions weren't being copied.
            - Top-level `try/except` in `main()` now pops a Tk messagebox with
              the full traceback, so even a crash before the main window can
              be screenshotted by a tester.
            - Companion `OysterClipValidator-Diag.exe` console build for cases
              where the main .exe still misbehaves silently.
