name: Build MC Fabric Mod

on:
  push:
    paths:
      - 'mc-mod/**'
      - '.github/workflows/build-mc-mod.yml'
  pull_request:
    paths:
      - 'mc-mod/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Bootstrap gradlew if missing
        working-directory: mc-mod
        run: |
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.10
          fi

      - name: Build mod
        working-directory: mc-mod
        run: ./gradlew build --no-daemon --info

      - name: Verify mod jar
        working-directory: mc-mod
        run: |
          ls -lh build/libs/
          jar=$(ls build/libs/oyster-recorder-mod-*.jar | grep -v sources | head -1)
          if [ -z "$jar" ]; then
            echo "No mod jar produced"
            exit 1
          fi
          unzip -l "$jar" | grep -q fabric.mod.json || {
            echo "Mod jar missing fabric.mod.json"
            exit 1
          }
          echo "Mod jar OK: $(basename "$jar") ($(du -h "$jar" | cut -f1))"

      - name: Upload as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: oyster-recorder-mod
          path: mc-mod/build/libs/oyster-recorder-mod-*.jar
          if-no-files-found: error
