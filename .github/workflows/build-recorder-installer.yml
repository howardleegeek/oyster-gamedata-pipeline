name: Build Recorder Bundled Installer (R05E)

# R05E · Single-file consumer release pipeline
# ============================================
# This workflow runs the entire R05A→D bundled installer chain and uploads
# the resulting `OysterRecorder-Setup-vX.Y.Z.exe` to a GitHub Release.
#
# Trigger semantics
# -----------------
#   * `push` of any tag matching `recorder-v*`  → full release flow
#       (artifacts + Release page upload via `gh release create`).
#   * `workflow_dispatch`                       → pre-flight smoke build
#       (artifacts only, NO Release page upload — for testing CI without
#       cutting a real version). Spec R05E "Pre-flight workflow_dispatch".
#
# Iron-law constraints (from spec)
# --------------------------------
#   * Fail-loud on any SHA mismatch — every fetch_*.py script exits non-zero
#     on hash mismatch (R05A§数据准确铁律, R05B§数据准确铁律). The workflow
#     does NOT mask exit codes anywhere.
#   * Don't include build credentials in release notes — release_notes.md is
#     auto-generated from `git log <prev-tag>..HEAD` only. We never echo
#     env/secrets into the notes file.
#   * Don't ship intermediate artifacts to the Release page — the only
#     uploads are:
#       - OysterRecorder-Setup-${TAG}.exe   (the bundled installer)
#       - SHA-256-manifest.txt              (post-build manifest)
#       - 9 standalone mod jars             (advanced-user override path)
#     We do NOT upload the JRE zip, the MC client.jar, the Fabric profile
#     JSON, the OysterPlay.exe, the OysterRecorder onedir, or any other
#     build intermediate.
#
# Permissions
# -----------
#   `contents: write` is required for `gh release create / upload` and for
#   reading commit history with `git log` between tags. We use the default
#   `secrets.GITHUB_TOKEN` provided by Actions — no PAT, no service account.
#
# Caching
# -------
#   * `bin/.cache/jre/`     — Temurin 21 LTS zip (~50 MB), pinned by SHA.
#   * `bin/.cache/mc/`      — Mojang piston-meta libraries (~140 MB), pinned
#     by Mojang's own immutable per-version manifest.
#   * `bin/.cache/fabric/`  — Fabric loader libraries (~5 MB).
#   The cache key is content-addressed by `bin/build_bundled_installer/manifest.json`
#   so any pin bump auto-invalidates the cache — exactly matching the
#   fail-loud SHA verification semantics.
#
# Estimated runtime per release tag
# ---------------------------------
#   ~22-28 minutes on `windows-latest` (cold cache):
#     * checkout + setup-python + choco install innosetup    ~ 4 min
#     * R05A fetch JRE       (50 MB DL + extract + verify)   ~ 1 min
#     * R05B fetch MC        (140 MB DL + verify ~60 libs +  ~ 7 min
#                             rc7: ~390 MB DL of asset objects, parallel)
#     * R05B fetch Fabric    (5 MB DL + verify 8 libs)       ~ 1 min
#     * R05C build OysterPlay.exe (PyInstaller, small)       ~ 2 min
#     * Build OysterRecorder onedir (PyInstaller, ~700 MB)   ~ 6 min
#     * Compose bundle/manifest.json (SHA-256 every file)    ~ 1 min
#     * R05D Inno Setup compile (~800 MB installer .exe)     ~ 3 min
#     * Final SHA + gh release create + upload               ~ 2 min
#   Warm cache (JRE + MC zips reused) shaves ~4 min off the front.
#
# Security note
# -------------
#   User-supplied workflow_dispatch input `smoke_tag` is read into an env
#   var via the `env:` block of the resolution step (NOT inlined into
#   `run:` via ${{ ... }}). This prevents command-injection if an attacker
#   ever opens the dispatch UI to anyone with read perms.

"on":
  push:
    tags:
      - 'recorder-v*'
  workflow_dispatch:
    inputs:
      smoke_tag:
        description: 'Synthetic version for smoke build (no Release upload). Default: v0.0.0-smoke'
        required: false
        default: 'v0.0.0-smoke'

permissions:
  contents: write

jobs:
  bundle-and-release:
    # Inno Setup compiler (iscc.exe) is Windows-only — there is no Linux
    # cross-compile path we can stomach for an enterprise installer flow.
    runs-on: windows-latest
    timeout-minutes: 45

    env:
      # ASCII-only Python output — Windows runners default to cp1252 and
      # `print` of non-ASCII (e.g. status emojis from fetch_*.py) crashes
      # mid-pipeline with UnicodeEncodeError. UTF-8 is the only sane default.
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: '1'
      EV_CERT_PFX: ${{ secrets.EV_CERT_PFX || secrets.EV_CERT_PFX_BASE64 }}
      EV_CERT_PASSWORD: ${{ secrets.EV_CERT_PASSWORD }}

    steps:
      # ---------------------------------------------------------------------
      # 1. Checkout
      # ---------------------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # We need full history (or at least back to the previous
          # `recorder-v*` tag) so `git log <prev>..HEAD` can build the
          # auto-generated release notes. fetch-depth: 0 is the only
          # safe choice — calling `git fetch --tags --depth=...` with a
          # bounded depth is fragile when the previous tag is far back.
          fetch-depth: 0

      # ---------------------------------------------------------------------
      # 2. Resolve the version we're building
      # ---------------------------------------------------------------------
      # On a tag push: TAG = github.ref_name (e.g. "recorder-v1.2.3"),
      #                VERSION = the bit after the prefix (e.g. "1.2.3").
      # On workflow_dispatch (smoke): TAG = inputs.smoke_tag (e.g. "v0.0.0-smoke"),
      #                               VERSION = same minus any leading "v".
      # All downstream steps reference $env:RELEASE_TAG and $env:APP_VERSION
      # so neither code path special-cases below this step.
      #
      # SECURITY: SMOKE_TAG_INPUT is read from workflow_dispatch user input
      # via env, NEVER inlined into the script body — that would be a
      # command-injection sink if anyone with workflow_dispatch perms ever
      # types something cute into the form.
      - name: Resolve release tag + app version
        id: version
        shell: pwsh
        env:
          SMOKE_TAG_INPUT: ${{ github.event.inputs.smoke_tag }}
        run: |
          if ($env:GITHUB_EVENT_NAME -eq 'push' -and $env:GITHUB_REF -like 'refs/tags/recorder-v*') {
            $tag = $env:GITHUB_REF -replace '^refs/tags/', ''
            $version = $tag -replace '^recorder-v', ''
            $isRelease = 'true'
          } else {
            $tag = $env:SMOKE_TAG_INPUT
            if ([string]::IsNullOrWhiteSpace($tag)) { $tag = 'v0.0.0-smoke' }
            # Reject anything that isn't a tame version-ish identifier so
            # downstream filenames / gh CLI args can't be hijacked.
            if ($tag -notmatch '^[A-Za-z0-9._\-]+$') {
              Write-Error "Refusing smoke_tag '$tag' — must match ^[A-Za-z0-9._-]+$"
              exit 1
            }
            $version = $tag -replace '^v', ''
            $isRelease = 'false'
          }
          if ([string]::IsNullOrWhiteSpace($version)) {
            Write-Error "Could not resolve a non-empty version from tag '$tag'"
            exit 1
          }
          Write-Host "RELEASE_TAG = $tag"
          Write-Host "APP_VERSION = $version"
          Write-Host "IS_RELEASE  = $isRelease"
          "RELEASE_TAG=$tag"     | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "APP_VERSION=$version" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "IS_RELEASE=$isRelease"| Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      # ---------------------------------------------------------------------
      # 3. Toolchain — Python 3.12 + PyInstaller
      # ---------------------------------------------------------------------
      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          # PyInstaller drives both R05C (OysterPlay.exe compile) and the
          # OysterRecorder onedir step. Keep this list narrow — anything
          # the recorder needs at runtime (depth-anything, pynput, etc.)
          # will be pulled in by recorder_consumer_lite.py via PyInstaller's
          # --collect-all directives, not pinned at the workflow level.
          pip install "pyinstaller>=6.0"
          pip install pynput pillow numpy pyyaml
          pip install -r bin/build_bundled_installer/requirements-recorder.txt
          pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision
          pip install transformers "imageio[ffmpeg]" OpenEXR Imath huggingface_hub
          python -c "import PyInstaller, sys; print(f'PyInstaller {PyInstaller.__version__} on Python {sys.version.split()[0]}')"

      # ---------------------------------------------------------------------
      # 4. Toolchain — Inno Setup (Windows-only via Chocolatey)
      # ---------------------------------------------------------------------
      - name: Install Inno Setup via Chocolatey
        shell: pwsh
        run: |
          # GitHub-hosted windows-latest runners have choco preinstalled.
          # `--no-progress` keeps the CI log readable; `-y` accepts EULA.
          choco install innosetup -y --no-progress
          # Sanity: locate iscc.exe and put its dir on PATH for later steps.
          $iscc = Get-Command iscc.exe -ErrorAction SilentlyContinue
          if (-not $iscc) {
            $candidates = @(
              "$env:ProgramFiles\Inno Setup 6\ISCC.exe",
              "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
            )
            $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
            if (-not $iscc) {
              Write-Error "iscc.exe not found after choco install innosetup"
              exit 1
            }
            $isccDir = Split-Path -Parent $iscc
            "$isccDir" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
            Write-Host "Added $isccDir to PATH"
          }
          iscc.exe /? | Select-Object -First 5

      # ---------------------------------------------------------------------
      # 5. Caches — JRE, MC, Fabric blobs are content-pinned via manifest.json
      # ---------------------------------------------------------------------

      - name: Download VC++ Redistributable (S131)
        shell: pwsh
        run: |
          $url = "https://aka.ms/vs/17/release/vc_redist.x64.exe"
          $out = "bin/build_bundled_installer/vc_redist.x64.exe"
          Invoke-WebRequest -Uri $url -OutFile $out -UseBasicParsing
          $size = (Get-Item $out).Length
          if ($size -lt 10000000) { Write-Error "vc_redist too small: $size"; exit 1 }
          Write-Host "Downloaded vc_redist.x64.exe ($size bytes)"
      - name: Cache bundled-installer fetch artifacts
        uses: actions/cache@v4
        with:
          # All three fetch_*.py scripts default to bin/.cache/<kind>/.
          # A single cache entry keyed on the manifest hash invalidates the
          # whole bundle the moment any pin bumps — which is exactly the
          # behavior we want, because a bumped pin means the SHA changed
          # and the cached blob would fail verification anyway.
          path: |
            bin/.cache/jre
            bin/.cache/mc
            bin/.cache/fabric
          key: bundled-installer-${{ runner.os }}-${{ hashFiles('bin/build_bundled_installer/manifest.json') }}
          restore-keys: |
            bundled-installer-${{ runner.os }}-

      # ---------------------------------------------------------------------
      # 6. R05A — fetch + verify Eclipse Temurin OpenJDK 21 LTS JRE
      # ---------------------------------------------------------------------
      - name: R05A — Fetch JRE (Temurin 21 LTS)
        shell: pwsh
        run: |
          python bin/build_bundled_installer/fetch_jre.py
          if (-not (Test-Path 'bundle/jre/bin/javaw.exe')) {
            Write-Error "R05A invariant violated: bundle/jre/bin/javaw.exe missing after fetch_jre.py exited 0"
            exit 1
          }
          $size_mb = [math]::Round((Get-ChildItem -Recurse bundle/jre | Measure-Object -Property Length -Sum).Sum / 1MB, 1)
          Write-Host "JRE staged at bundle/jre/ (${size_mb} MB)"

      # ---------------------------------------------------------------------
      # 7. R05B — fetch + verify vanilla Minecraft 1.21.4 client + libs
      # ---------------------------------------------------------------------
      - name: R05B — Fetch vanilla Minecraft 1.21.4
        shell: pwsh
        run: |
          python bin/build_bundled_installer/fetch_minecraft.py
          $required = @(
            'bundle/mc-instance/versions/1.21.4/1.21.4.jar',
            'bundle/mc-instance/versions/1.21.4/1.21.4.json',
            'bundle/mc-instance/assets/indexes/19.json'
          )
          foreach ($f in $required) {
            if (-not (Test-Path $f)) {
              Write-Error "R05B invariant violated: required file missing after fetch_minecraft.py: $f"
              exit 1
            }
          }
          $libs = Get-ChildItem -Recurse bundle/mc-instance/libraries -ErrorAction SilentlyContinue
          $size_mb = [math]::Round((Get-ChildItem -Recurse bundle/mc-instance | Measure-Object -Property Length -Sum).Sum / 1MB, 1)
          Write-Host "MC libraries: $($libs.Count) files, ${size_mb} MB"

      # ---------------------------------------------------------------------
      # 8. R05B — fetch + verify Fabric loader 0.16.10 for MC 1.21.4
      # ---------------------------------------------------------------------
      - name: R05B — Fetch Fabric loader 0.16.10
        shell: pwsh
        run: |
          python bin/build_bundled_installer/fetch_fabric.py
          $fabricProfile = 'bundle/mc-instance/versions/fabric-loader-0.16.10-1.21.4/fabric-loader-0.16.10-1.21.4.json'
          if (-not (Test-Path $fabricProfile)) {
            Write-Error "R05B invariant violated: fabric profile missing: $fabricProfile"
            exit 1
          }

      # ---------------------------------------------------------------------
      # 9. R05C — compile OysterPlay.py → OysterPlay.exe
      # ---------------------------------------------------------------------
      - name: R05C — Build OysterPlay.exe (consumer launcher)
        shell: pwsh
        run: |
          python bin/build_bundled_installer/build_oysterplay_exe.py --onefile --clean
          if (-not (Test-Path 'dist/OysterPlay.exe')) {
            Write-Error "R05C invariant violated: dist/OysterPlay.exe missing after build_oysterplay_exe.py exited 0"
            exit 1
          }
          $size_mb = [math]::Round((Get-Item 'dist/OysterPlay.exe').Length / 1MB, 1)
          Write-Host "OysterPlay.exe = ${size_mb} MB"

      # ---------------------------------------------------------------------
      # 10. Pull mod jars from the build-mc-mod workflow's artifacts
      # ---------------------------------------------------------------------
      # The mod jars are NOT built by this workflow — they're produced by
      # `.github/workflows/build-mc-mod.yml` (one job per MC version, 9
      # versions). We download the latest successful run on `main` so the
      # bundled installer always carries fresh-against-trunk mods.
      #
      # The 1.21.4 jar gets bundled inside the installer (matches the
      # bundled MC instance version). The other 8 jars get uploaded
      # alongside the installer for advanced users who want a different
      # MC version (R05E acceptance: "9 个 mod jars (单独 download for
      # advanced users)").
      - name: Download mod jars from build-mc-mod artifacts
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: build-mc-mod.yml
          workflow_conclusion: success
          branch: main
          name_is_regexp: true
          name: '^oyster-recorder-mod-mc.*'
          path: mod-jars
          if_no_artifact_found: fail
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Stage mod jars (single bundled + all release-extras)
        shell: pwsh
        run: |
          # Only the 1.21.4 recorder mod goes into the bundled MC instance.
          # All supported-version jars still go to release-extras/ for the
          # standalone-mod-jar download path on the Release page.
          New-Item -ItemType Directory -Force -Path 'bundle/mc-instance/mods' | Out-Null
          New-Item -ItemType Directory -Force -Path 'release-extras' | Out-Null
          $allJars = Get-ChildItem -Recurse mod-jars -Filter '*.jar' `
                       | Where-Object { $_.Name -notmatch '-sources' -and $_.Name -notmatch '-javadoc' }
          if ($allJars.Count -lt 9) {
            Write-Error "Expected 9 mod jars across MC versions, found $($allJars.Count)"
            exit 1
          }
          # De-dupe by filename (action-download-artifact may stage multiple
          # copies if the regex matched multiple artifact bundles).
          $seen = @{}
          foreach ($jar in $allJars) {
            if ($seen.ContainsKey($jar.Name)) { continue }
            $seen[$jar.Name] = $true
            Copy-Item $jar.FullName -Destination 'release-extras/' -Force
          }
          $bundleJar = $allJars |
            Where-Object { $_.Name -match '-mc1\.21\.4\.jar$' } |
            Select-Object -First 1
          if (-not $bundleJar) {
            Write-Error "Could not find a 1.21.4 mod jar to bundle into the Minecraft instance"
            exit 1
          }
          Copy-Item $bundleJar.FullName -Destination 'bundle/mc-instance/mods/' -Force
          $bundleRecorderMods = Get-ChildItem 'bundle/mc-instance/mods' `
            -Filter 'oyster-recorder-mod-*.jar'
          $extraCount  = (Get-ChildItem 'release-extras' -Filter '*.jar').Count
          Write-Host "Bundled recorder mod: $($bundleJar.Name)"
          Write-Host "Release-extras: $extraCount (uploaded as standalone Release assets)"
          if ($bundleRecorderMods.Count -ne 1) {
            Write-Error "Expected exactly one bundled recorder mod, found $($bundleRecorderMods.Count)"
            exit 1
          }
          if ($extraCount -lt 9) {
            Write-Error "After staging only $extraCount mod jars in release-extras, expected 9"
            exit 1
          }

      # ---------------------------------------------------------------------
      # 11. Build the OysterRecorder onedir (recorder_consumer_lite.py)
      # ---------------------------------------------------------------------
      # Mirrors `build-recorder-exe.yml`'s --onedir branch. We only need the
      # onedir form for the bundled installer (Inno Setup ships a folder,
      # not a wrapped single-file .exe), so we skip the --onefile build
      # entirely here.
      - name: Pre-download DepthAnything V2 weights
        shell: pwsh
        run: |
          python -c "from huggingface_hub import snapshot_download; snapshot_download(repo_id='depth-anything/Depth-Anything-V2-Small-hf', local_dir='hf_cache/depth-anything-v2-small-hf')"

      - name: Download ffmpeg (Windows x64, GPL static)
        shell: pwsh
        run: |
          $url = 'https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip'
          Invoke-WebRequest -Uri $url -OutFile ffmpeg.zip
          Expand-Archive -Path ffmpeg.zip -DestinationPath ffmpeg-extracted -Force
          $ffmpegBin = Get-ChildItem -Recurse ffmpeg-extracted -Filter 'ffmpeg.exe' | Select-Object -First 1
          Copy-Item $ffmpegBin.FullName -Destination 'ffmpeg.exe' -Force
          Get-Item ffmpeg.exe | Format-List Length, FullName
          $ffprobeBin = Get-ChildItem -Recurse ffmpeg-extracted -Filter 'ffprobe.exe' | Select-Object -First 1
          Copy-Item $ffprobeBin.FullName -Destination 'ffprobe.exe' -Force
          Get-Item ffprobe.exe | Format-List Length, FullName

      - name: Download Fabric installer jar
        shell: pwsh
        run: |
          $url = 'https://maven.fabricmc.net/net/fabricmc/fabric-installer/1.0.1/fabric-installer-1.0.1.jar'
          Invoke-WebRequest -Uri $url -OutFile fabric-installer.jar

      - name: Build OysterRecorder onedir (PyInstaller)
        shell: pwsh
        run: |
          # Single mod jar copy for the onedir install — this matches D17's
          # behavior so the recorder can write its own copy alongside the
          # user's MC if they ever launch outside the bundled instance.
          # Pick the 1.21.4 jar (matches the bundled MC version).
          $modJar = Get-ChildItem 'bundle/mc-instance/mods' -Filter '*-mc1.21.4.jar' `
                       | Select-Object -First 1
          if (-not $modJar) {
            Write-Error "Could not find a 1.21.4 mod jar to bundle into the recorder onedir"
            exit 1
          }
          Copy-Item $modJar.FullName -Destination 'oyster-recorder-mod.jar' -Force
          # PyInstaller's --distpath drops OysterRecorder-onedir directly
          # into bundle/ — exactly where installer.iss's [Files] line
          # `Source: "{#BundleRoot}\\OysterRecorder-onedir\\*"` looks for it.
          pyinstaller --onedir --windowed `
            --name OysterRecorder-onedir `
            --distpath bundle `
            --workpath build/OysterRecorder-onedir `
            --add-binary "ffmpeg.exe;." `
            --add-binary "ffprobe.exe;." `
            --add-data "bin/lint_v3_prd_grounded.py;." `
            --add-data "bin/generate_systeminfo_json.py;." `
            --add-data "bin/generate_gameinfo_xlsx.py;." `
            --add-data "bin/depth_anything_v2_inference.py;." `
            --add-data "bin/install_fabric_loader.py;." `
            --add-data "bin/game_state_overlay.py;." `
            --add-data "fabric-installer.jar;." `
            --add-data "oyster-recorder-mod.jar;." `
            --add-data "hf_cache;hf_cache" `
            --paths bin `
            --collect-all tkinter `
            --collect-all pynput `
            --collect-all numpy `
            --collect-all PIL `
            --collect-all yaml `
            --collect-all windows_capture `
            --collect-all mss `
            --collect-all torch `
            --collect-all transformers `
            --collect-all OpenEXR `
            --collect-all Imath `
            --collect-all imageio `
            --collect-all imageio_ffmpeg `
            --hidden-import pynput.keyboard._win32 `
            --hidden-import pynput.mouse._win32 `
            --hidden-import lint_v3_prd_grounded `
            --hidden-import generate_systeminfo_json `
            --hidden-import generate_gameinfo_xlsx `
            --hidden-import depth_anything_v2_inference `
            --hidden-import install_fabric_loader `
            --hidden-import game_state_overlay `
            --hidden-import windows_capture `
            --hidden-import mss `
            --hidden-import PIL.Image `
            bin/recorder_consumer_lite.py
          if (-not (Test-Path 'bundle/OysterRecorder-onedir/OysterRecorder-onedir.exe')) {
            Write-Error "PyInstaller did not produce bundle/OysterRecorder-onedir/OysterRecorder-onedir.exe"
            exit 1
          }

      - name: Stage OBS Studio portable into OysterRecorder onedir
        shell: pwsh
        run: |
          # v0.19: ship OBS Studio portable inside the PyInstaller onedir
          # bundle. The recorder runtime owns profile/scene generation and
          # launch args; CI only stages the official portable OBS tree.
          $obsVersion = "30.2.3"
          $obsZipName = "OBS-Studio-$obsVersion-Windows.zip"
          $obsUrl = "https://github.com/obsproject/obs-studio/releases/download/$obsVersion/$obsZipName"
          $obsSha256 = "c5bf721258f6d8b2342ed39f04e65cdd3a07a9d1300654471d4be91d87fee65b"
          $obsExpectedBytes = 158525553
          Write-Host "Downloading OBS Studio portable $obsVersion from $obsUrl"
          Invoke-WebRequest -Uri $obsUrl -OutFile $obsZipName
          $obsZip = Get-Item $obsZipName
          if ($obsZip.Length -ne $obsExpectedBytes) {
            Write-Error "OBS Studio zip size mismatch: expected $obsExpectedBytes bytes, got $($obsZip.Length)"
            exit 1
          }
          $obsHash = (Get-FileHash $obsZipName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($obsHash -ne $obsSha256) {
            Write-Error "OBS Studio zip SHA256 mismatch: expected $obsSha256, got $obsHash"
            exit 1
          }
          Write-Host "Verified OBS Studio portable ${obsVersion}: $($obsZip.Length) bytes, sha256:$obsHash"

          $obsExtractDir = "obs-studio-extracted"
          Remove-Item -Recurse -Force $obsExtractDir -ErrorAction SilentlyContinue
          Expand-Archive -Path $obsZipName -DestinationPath $obsExtractDir -Force
          $obsExe = Get-ChildItem -Path $obsExtractDir -Recurse -Filter "obs64.exe" |
            Where-Object { $_.FullName -match '\\bin\\64bit\\obs64\.exe$' } |
            Select-Object -First 1
          if (-not $obsExe) {
            Write-Error "OBS Studio portable extraction did not contain bin/64bit/obs64.exe"
            exit 1
          }
          $obsRoot = $obsExe.Directory.Parent.Parent.FullName
          $obsDest = "bundle/OysterRecorder-onedir/_internal/obs"
          Remove-Item -Recurse -Force $obsDest -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $obsDest | Out-Null
          Copy-Item -Path (Join-Path $obsRoot "*") -Destination $obsDest -Recurse -Force

          # Official OBS portable mode uses portable_mode.txt. Keep the
          # spec-named marker too; it is harmless and makes the bundle intent
          # obvious to humans inspecting the tree.
          New-Item -ItemType File -Force -Path (Join-Path $obsDest "portable_mode.txt") | Out-Null
          New-Item -ItemType File -Force -Path (Join-Path $obsDest "obs_portable.txt") | Out-Null
          New-Item -ItemType Directory -Force -Path (Join-Path $obsDest "config") | Out-Null

          $requiredObsPaths = @(
            "bin/64bit/obs64.exe",
            "bin/64bit/obs-amf-test.exe",
            "bin/64bit/obs-nvenc-test.exe",
            "bin/64bit/obs-qsv-test.exe",
            "data",
            "obs-plugins",
            "obs-plugins/64bit/obs-ffmpeg.dll",
            "obs-plugins/64bit/obs-qsv11.dll",
            "obs-plugins/64bit/obs-websocket.dll",
            "obs-plugins/64bit/win-capture.dll",
            "portable_mode.txt",
            "obs_portable.txt"
          )
          foreach ($relative in $requiredObsPaths) {
            $candidate = Join-Path $obsDest $relative
            if (-not (Test-Path $candidate)) {
              Write-Error "Bundled OBS Studio is missing required path: $relative"
              exit 1
            }
          }
          $bundledObsExe = Resolve-Path (Join-Path $obsDest "bin/64bit/obs64.exe")
          Write-Host "Bundled OBS Studio version: $obsVersion"
          Write-Host "Bundled obs64.exe path: $bundledObsExe"

      # ---------------------------------------------------------------------
      # 12. Stage the full bundle layout that installer.iss expects
      # ---------------------------------------------------------------------
      # The exact paths come from bin/build_bundled_installer/installer.iss
      # `[Files]` block (kept in sync deliberately):
      #   Source: "{#BundleRoot}\jre\*"                  -> bundle/jre/...
      #   Source: "{#BundleRoot}\mc-instance\*"          -> bundle/mc-instance/...
      #   Source: "{#BundleRoot}\OysterRecorder-onedir\*"-> bundle/OysterRecorder-onedir/
      #   Source: "{#BundleRoot}\OysterRecorder-onedir\_internal\obs\*"-> bundled OBS Studio portable
      #   Source: "{#BundleRoot}\OysterPlay.exe"         -> bundle/OysterPlay.exe
      #   Source: "{#BundleRoot}\manifest.json"          -> bundle/manifest.json
      - name: Compose bundle/ layout
        shell: pwsh
        run: |
          # OysterPlay.exe lives at the top of the bundle (NOT under
          # bundle/launcher/) — installer.iss references it by that exact path.
          Copy-Item 'dist/OysterPlay.exe' -Destination 'bundle/OysterPlay.exe' -Force
          # Sanity: every file installer.iss will reference must exist.
          $required = @(
            'bundle/jre/bin/javaw.exe',
            'bundle/mc-instance/versions/1.21.4/1.21.4.jar',
            'bundle/mc-instance/versions/fabric-loader-0.16.10-1.21.4/fabric-loader-0.16.10-1.21.4.json',
            'bundle/mc-instance/mods',
            'bundle/OysterPlay.exe',
            'bundle/OysterRecorder-onedir/OysterRecorder-onedir.exe',
            'bundle/OysterRecorder-onedir/_internal/obs/bin/64bit/obs64.exe',
            'bundle/OysterRecorder-onedir/_internal/obs/portable_mode.txt',
            'bundle/OysterRecorder-onedir/_internal/obs/obs_portable.txt'
          )
          foreach ($p in $required) {
            if (-not (Test-Path $p)) {
              Write-Error "Bundle layout invariant violated: $p missing"
              exit 1
            }
          }
          $size_mb = [math]::Round((Get-ChildItem -Recurse bundle | Measure-Object -Property Length -Sum).Sum / 1MB, 1)
          Write-Host "Bundle staged. Total size: ${size_mb} MB"

      # ---------------------------------------------------------------------
      # 13. Compose bundle/manifest.json — SHA-256 of every top-level artifact
      # ---------------------------------------------------------------------
      # Inline pwsh because we don't want to add another Python script to
      # the spec set just for hashing. Every file inside bundle/ gets a
      # SHA-256 — directories are summarized by their flat-file SHA list,
      # not one-shot tar-and-hash, because Inno Setup unpacks individual
      # files.
      - name: Compose bundle/manifest.json (SHA-256 every file)
        shell: pwsh
        run: |
          $entries = @()
          Get-ChildItem -Recurse -File bundle | ForEach-Object {
            $rel = (Resolve-Path $_.FullName -Relative) -replace '^\.\\', '' -replace '\\', '/'
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            $entries += [pscustomobject]@{
              path = $rel
              size_bytes = $_.Length
              sha256 = $hash
            }
          }
          $manifest = [pscustomobject]@{
            schema_version = 1
            produced_by = '.github/workflows/build-recorder-installer.yml'
            release_tag = $env:RELEASE_TAG
            app_version = $env:APP_VERSION
            commit_sha = $env:GITHUB_SHA
            file_count = $entries.Count
            files = $entries
          }
          $manifestPath = 'bundle/manifest.json'
          $manifest | ConvertTo-Json -Depth 6 | Out-File -Encoding utf8 $manifestPath
          Write-Host "Wrote $manifestPath with $($entries.Count) entries"

      # ---------------------------------------------------------------------
      # 14. R05D — Inno Setup compile installer.iss
      # ---------------------------------------------------------------------
      # installer.iss declares:
      #   OutputDir=..\\..\\dist\\installer
      #   OutputBaseFilename=OysterRecorder-Setup-v{#AppVersion}
      # so passing /DAppVersion=$APP_VERSION (e.g. 1.2.3) yields:
      #   dist/installer/OysterRecorder-Setup-v1.2.3.exe
      # We copy that into dist/ with a release-tag-prefixed name (e.g.
      # OysterRecorder-Setup-recorder-v1.2.3.exe) for the upload step,
      # since the Release page's filename should match the tag exactly.
      - name: R05D — Inno Setup compile installer
        shell: pwsh
        run: |
          $iss = 'bin/build_bundled_installer/installer.iss'
          if (-not (Test-Path $iss)) {
            Write-Error "R05D artifact missing: $iss (check spec R05D_inno_setup_installer.md)"
            exit 1
          }
          $obsVersion = "30.2.3"
          $bundledObsExe = "bundle/OysterRecorder-onedir/_internal/obs/bin/64bit/obs64.exe"
          $portableMarker = "bundle/OysterRecorder-onedir/_internal/obs/portable_mode.txt"
          $specMarker = "bundle/OysterRecorder-onedir/_internal/obs/obs_portable.txt"
          foreach ($p in @($bundledObsExe, $portableMarker, $specMarker)) {
            if (-not (Test-Path $p)) {
              Write-Error "Installer compile preflight missing bundled OBS Studio artifact: $p"
              exit 1
            }
          }
          Write-Host "Preflight bundled OBS Studio version: $obsVersion"
          Write-Host "Preflight bundled obs64.exe path: $(Resolve-Path $bundledObsExe)"
          # /Qp = quiet w/ progress (no /SILENT), /D injects preprocessor symbol.
          iscc.exe /Qp "/DAppVersion=$env:APP_VERSION" $iss
          if ($LASTEXITCODE -ne 0) {
            Write-Error "iscc.exe exited $LASTEXITCODE — installer compile failed"
            exit 1
          }
          # installer.iss's OutputDir is "..\\..\\dist\\installer" (relative
          # to the .iss file); resolved to repo-root that's dist/installer/.
          $issOut = "dist/installer/OysterRecorder-Setup-v$env:APP_VERSION.exe"
          if (-not (Test-Path $issOut)) {
            Write-Error "Inno Setup output not found at $issOut"
            Get-ChildItem -Recurse -Filter 'OysterRecorder-Setup-*.exe' `
              | ForEach-Object { Write-Host "  found candidate: $($_.FullName)" }
            exit 1
          }
          # Final upload filename is keyed on the RELEASE_TAG (e.g.
          # `recorder-v1.2.3`), not the bare semver, so the Release page
          # asset name and the tag are 1:1.
          $finalExe = "dist/OysterRecorder-Setup-$env:RELEASE_TAG.exe"
          Copy-Item -Force $issOut $finalExe
          $size_mb = [math]::Round((Get-Item $finalExe).Length / 1MB, 1)
          Write-Host "Installer built: $finalExe (${size_mb} MB)"
          if (-not (Test-Path $bundledObsExe)) {
            Write-Error "Bundled OBS Studio artifact disappeared after installer compile: $bundledObsExe"
            exit 1
          }
          Write-Host "Installer bundles OBS Studio $obsVersion"
          Write-Host "Bundled obs64.exe path: $(Resolve-Path $bundledObsExe)"
          # Iron-law size sanity gate (mirrors build_all.ps1 stage 8).
          $bytes = (Get-Item $finalExe).Length
          if ($bytes -lt (400 * 1MB)) {
            Write-Error "Installer is too small (${size_mb} MiB < 400 MiB) — JRE / MC bundle may be missing"
            exit 1
          }
          if ($bytes -gt (1200 * 1MB)) {
            # rc7 target is ~800 MB (rc6 was ~460 MB before bundling MC
            # asset objects). OBS portable adds ~150 MB compressed on top,
            # so the ceiling allows that plus minor mod / weight bloat
            # without falsely failing a healthy build.
            Write-Error "Installer is too large (${size_mb} MiB > 1200 MiB) — investigate Solid compression"
            exit 1
          }

      # ---------------------------------------------------------------------
      # 15. Optional Authenticode signing
      # ---------------------------------------------------------------------
      # Sign before hashing/upload so SHA-256-manifest.txt matches the exact
      # consumer-facing executable attached to the Release page.
      - name: Sign bundled installer (EV cert)
        if: env.EV_CERT_PFX != ''
        shell: pwsh
        run: |
          $installer = "dist/OysterRecorder-Setup-$env:RELEASE_TAG.exe"
          if (-not (Test-Path $installer)) {
            Write-Error "Bundled installer not found at $installer"
            exit 1
          }
          & installer\sign_installer.ps1 -FilePath $installer
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Warn — bundled installer is unsigned
        if: env.EV_CERT_PFX == ''
        shell: pwsh
        run: |
          Write-Warning "EV_CERT_PFX secret not set — bundled installer will be distributed UNSIGNED."
          Write-Warning "Add EV_CERT_PFX (or legacy EV_CERT_PFX_BASE64) and EV_CERT_PASSWORD to repository secrets to enable signing."

      # ---------------------------------------------------------------------
      # 16. SHA-256 the final installer + emit SHA-256-manifest.txt
      # ---------------------------------------------------------------------
      - name: SHA-256 installer + write SHA-256-manifest.txt
        shell: pwsh
        run: |
          $installer = "dist/OysterRecorder-Setup-$env:RELEASE_TAG.exe"
          $instHash = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLower()
          # release-extras/*.jar (the 9 advanced-user mod jars) get hashed
          # too, so power users can verify any individual download.
          $generatedAt = (Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ')
          $lines = @(
            "# OysterRecorder $env:RELEASE_TAG — SHA-256 manifest"
            "# Generated $generatedAt by build-recorder-installer.yml"
            "# Commit: $env:GITHUB_SHA"
            ""
            "$instHash  $(Split-Path -Leaf $installer)"
          )
          Get-ChildItem release-extras -Filter '*.jar' | Sort-Object Name | ForEach-Object {
            $h = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            $lines += "$h  $($_.Name)"
          }
          $manifestPath = 'dist/SHA-256-manifest.txt'
          $lines | Out-File -Encoding ascii $manifestPath
          Write-Host "Wrote $manifestPath"
          Get-Content $manifestPath | Select-Object -First 20 | ForEach-Object { Write-Host "  $_" }

      # ---------------------------------------------------------------------
      # 17. Generate release_notes.md from git log between previous tag and HEAD
      # ---------------------------------------------------------------------
      # IRON LAW: never include build credentials in notes. We only call
      # `git log` and `git tag` — no env, no secrets are echoed in.
      - name: Generate release_notes.md from commit log
        if: env.IS_RELEASE == 'true'
        shell: bash
        run: |
          set -euo pipefail
          # Find the most recent recorder-v* tag BEFORE the current one.
          prev_tag=$(git tag --list 'recorder-v*' --sort=-v:refname \
                     | grep -v "^${RELEASE_TAG}$" | head -n1 || true)
          {
            echo "# Oyster Recorder ${RELEASE_TAG}"
            echo
            echo "Single-file Windows installer with bundled JRE + Minecraft 1.21.4 + Fabric loader + Oyster recording mod. Double-click \`OysterRecorder-Setup-${RELEASE_TAG}.exe\` to install (no admin required, installs to \`%LOCALAPPDATA%\\OysterRecorder\\\`). The installer launches OysterPlay by default on Finish, and OysterPlay opens the bundled Minecraft instance."
            echo
            echo "## What's in this release"
            echo
            echo "- **\`OysterRecorder-Setup-${RELEASE_TAG}.exe\`** — main bundled installer (recommended download)"
            echo "- **\`SHA-256-manifest.txt\`** — verification hashes for every release artifact"
            echo "- **9 mod jars** — \`oyster-recorder-mod-*-mc<MC_VERSION>.jar\` for advanced users running their own MC outside the bundled instance"
            echo
            echo "## Changes since ${prev_tag:-initial release}"
            echo
            if [ -n "${prev_tag}" ]; then
              git log --pretty=format:'- %s (%h)' "${prev_tag}..HEAD" \
                | grep -v -E '^\- (chore|ci): ' \
                || echo "- No user-facing commits between ${prev_tag} and ${RELEASE_TAG}"
            else
              echo "- Initial bundled installer release."
            fi
            echo
            echo
            echo "## Verifying your download"
            echo
            echo "All artifacts are SHA-256 pinned. Compare your local hash against \`SHA-256-manifest.txt\`:"
            echo
            echo '```powershell'
            echo "Get-FileHash OysterRecorder-Setup-${RELEASE_TAG}.exe -Algorithm SHA256"
            echo '```'
          } > release_notes.md
          echo "--- release_notes.md preview ---"
          head -40 release_notes.md

      # ---------------------------------------------------------------------
      # 18. Upload everything to the GitHub Release (tag-push only)
      # ---------------------------------------------------------------------
      # `gh release create` is idempotent only via `--clobber` on upload,
      # NOT on create itself. So we split: create-if-not-exists, then upload
      # with --clobber so re-runs of the same tag don't conflict.
      - name: Create / update GitHub Release (tag-push only)
        if: env.IS_RELEASE == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --title "Recorder $RELEASE_TAG" \
              --notes-file release_notes.md
          else
            echo "Release $RELEASE_TAG already exists — re-uploading assets only."
          fi

      - name: Upload installer + SHA manifest + 9 mod jars
        if: env.IS_RELEASE == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # The ONLY user-facing assets per spec R05E:
          #   * the bundled installer .exe
          #   * the SHA-256 manifest
          #   * the 9 standalone mod jars (advanced users)
          # Notably absent: JRE zip, MC client.jar, Fabric profile JSON,
          # OysterPlay.exe, OysterRecorder-onedir, bundle/manifest.json.
          gh release upload "$RELEASE_TAG" \
            "dist/OysterRecorder-Setup-${RELEASE_TAG}.exe" \
            "dist/SHA-256-manifest.txt" \
            release-extras/oyster-recorder-mod-*.jar \
            --clobber

      # ---------------------------------------------------------------------
      # 19. Always upload the artifacts to the workflow run for inspection
      # ---------------------------------------------------------------------
      # Including on workflow_dispatch (smoke) — that's the whole point of
      # the smoke mode: verify the pipeline produced the right artifacts
      # without cutting a Release.
      - name: Upload workflow artifacts (smoke + full)
        uses: actions/upload-artifact@v4
        with:
          name: OysterRecorder-bundled-${{ env.RELEASE_TAG }}
          path: |
            dist/OysterRecorder-Setup-*.exe
            dist/SHA-256-manifest.txt
            release-extras/*.jar
            bundle/manifest.json
          if-no-files-found: error
          retention-days: 30
