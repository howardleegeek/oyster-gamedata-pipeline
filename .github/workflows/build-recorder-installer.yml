name: Build Recorder Bundled Installer (R05E)

# R05E · Single-file consumer release pipeline
# ============================================
# This workflow runs the entire R05A→D bundled installer chain and uploads
# the resulting `GameDataRecorder-Setup-vX.Y.Z.exe` to a GitHub Release.
#
# Trigger semantics
# -----------------
#   * `push` of any tag matching `recorder-v*`  → full release flow
#       (artifacts + Release page upload via `gh release create`).
#   * `workflow_dispatch`                       → pre-flight smoke build
#       (artifacts only, NO Release page upload — for testing CI without
#       cutting a real version). Spec R05E "Pre-flight workflow_dispatch".
#
# Iron-law constraints (from spec)
# --------------------------------
#   * Fail-loud on any SHA mismatch — every fetch_*.py script exits non-zero
#     on hash mismatch (R05A§数据准确铁律, R05B§数据准确铁律). The workflow
#     does NOT mask exit codes anywhere.
#   * Don't include build credentials in release notes — release_notes.md is
#     auto-generated from `git log <prev-tag>..HEAD` only. We never echo
#     env/secrets into the notes file.
#   * Don't ship intermediate artifacts to the Release page — the only
#     uploads are:
#       - GameDataRecorder-Setup-${TAG}.exe   (the bundled installer)
#       - SHA-256-manifest.txt              (post-build manifest)
#       - 9 standalone mod jars             (advanced-user override path)
#     We do NOT upload the JRE zip, the MC client.jar, the Fabric profile
#     JSON, the OysterPlay.exe, the OysterRecorder onedir, or any other
#     build intermediate.
#
# Permissions
# -----------
#   `contents: write` is required for `gh release create / upload` and for
#   reading commit history with `git log` between tags. We use the default
#   `secrets.GITHUB_TOKEN` provided by Actions — no PAT, no service account.
#
# Caching
# -------
#   * `bin/.cache/jre/`     — Temurin 21 LTS zip (~50 MB), pinned by SHA.
#   * `bin/.cache/mc/`      — Mojang piston-meta libraries (~140 MB), pinned
#     by Mojang's own immutable per-version manifest.
#   * `bin/.cache/fabric/`  — Fabric loader libraries (~5 MB).
#   The cache key is content-addressed by `bin/build_bundled_installer/manifest.json`
#   so any pin bump auto-invalidates the cache — exactly matching the
#   fail-loud SHA verification semantics.
#
# Estimated runtime per release tag
# ---------------------------------
#   ~22-28 minutes on `windows-latest` (cold cache):
#     * checkout + setup-python + choco install innosetup    ~ 4 min
#     * R05A fetch JRE       (50 MB DL + extract + verify)   ~ 1 min
#     * R05B fetch MC        (140 MB DL + verify ~60 libs +  ~ 7 min
#                             rc7: ~390 MB DL of asset objects, parallel)
#     * R05B fetch Fabric    (5 MB DL + verify 8 libs)       ~ 1 min
#     * R05C build OysterPlay.exe (PyInstaller, small)       ~ 2 min
#     * Build OysterRecorder onedir (PyInstaller, ~700 MB)   ~ 6 min
#     * Compose bundle/manifest.json (SHA-256 every file)    ~ 1 min
#     * R05D Inno Setup compile (~800 MB installer .exe)     ~ 3 min
#     * Final SHA + gh release create + upload               ~ 2 min
#   Warm cache (JRE + MC zips reused) shaves ~4 min off the front.
#
# Security note
# -------------
#   User-supplied workflow_dispatch input `smoke_tag` is read into an env
#   var via the `env:` block of the resolution step (NOT inlined into
#   `run:` via ${{ ... }}). This prevents command-injection if an attacker
#   ever opens the dispatch UI to anyone with read perms.

"on":
  # rc17.1.1 (Stream BE, Howard 2026-05-12): trigger triage post-mortem.
  #
  # Stream BA (rc17.0.4) tried to drive this bundler EXCLUSIVELY off
  # `workflow_run` completion of build-recorder-rust.yml, to fix a real
  # race: when both `push: tags: recorder-v*` and `workflow_run` were
  # active, the tag push triggered both workflows in parallel, the
  # bundler raced ahead at ~6 min, tried to download the Rust artifact,
  # and failed with "no matching workflow run found" while Rust was
  # still building.
  #
  # BUT — and this is the bug we hit on rc17.0.5 / rc17.1 — `workflow_run`
  # uses the workflow file *as defined on the default branch* at trigger
  # time. The Stream BA change was committed to `rc17.0-integrated` but
  # never merged to `main`, and main's bundler had no `workflow_run`
  # trigger. So when rc17.0.5/rc17.1 tag-pushed from rc17.0-integrated:
  #   - Rust workflow at the tag ref had push.tags → ran ✓
  #   - Bundler workflow at the tag ref had ONLY workflow_run → didn't fire
  #     on tag push ✗
  #   - workflow_run downstream gate on main had no workflow_run trigger
  #     either → didn't fire ✗
  # Result: zero bundler runs for rc17.0.5 / rc17.1, no installer .exe
  # was ever produced.
  #
  # Real fix: restore `push.tags` as the primary trigger so tag pushes
  # always fire the bundler immediately (no main-branch coupling). To
  # solve the race that motivated Stream BA, add an explicit
  # "Wait for upstream Rust workflow" step at the start of the job
  # (see steps[Wait for upstream Rust...]) that polls until Rust
  # succeeded for the same commit before any artifact download runs.
  # workflow_run is kept for rc16 branch CI only.
  push:
    tags:
      - 'recorder-v*'
  workflow_run:
    workflows: ['Build Recorder Rust EXE (R-rust-primary)']
    types: [completed]
  workflow_dispatch:
    inputs:
      smoke_tag:
        description: 'Synthetic version for smoke build (no Release upload). Default: v0.0.0-smoke'
        required: false
        default: 'v0.0.0-smoke'

permissions:
  contents: write

# rc15.25 ISC-6 (round 16 B8): concurrency group prevents two same-tag
# pushes from racing for `gh release create` and corrupting partial
# assets. cancel-in-progress: false so we don't drop a real build.
concurrency:
  group: recorder-build-installer-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bundle-and-release:
    # Inno Setup compiler (iscc.exe) is Windows-only — there is no Linux
    # cross-compile path we can stomach for an enterprise installer flow.
    runs-on: windows-latest
    timeout-minutes: 45

    # rc17.1.1 (Stream BE, Howard 2026-05-12): explicit per-trigger gate
    # to prevent double-fire on tag push. Tag pushes are handled by the
    # `push.tags` trigger (primary, fires reliably on tag creation);
    # workflow_run path is restricted to the rc16 branch CI flow only.
    #
    # Without this filter, a tag push that *also* completes the Rust
    # workflow successfully would queue two bundler runs (one from
    # push.tags, one from workflow_run on the tag-ref completion).
    # They would have different `github.ref` values (refs/tags/... vs
    # refs/heads/main), so the concurrency group would NOT serialize
    # them — they'd race for `gh release create` and corrupt the
    # release assets. Exclusive selection here keeps the bundler
    # single-firing per tag.
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/recorder-v')) ||
      (github.event_name == 'workflow_dispatch') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'recorder-v0.28.0-rc16')

    env:
      # ASCII-only Python output — Windows runners default to cp1252 and
      # `print` of non-ASCII (e.g. status emojis from fetch_*.py) crashes
      # mid-pipeline with UnicodeEncodeError. UTF-8 is the only sane default.
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: '1'

    steps:
      # ---------------------------------------------------------------------
      # 1. Checkout
      # ---------------------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # We need full history (or at least back to the previous
          # `recorder-v*` tag) so `git log <prev>..HEAD` can build the
          # auto-generated release notes. fetch-depth: 0 is the only
          # safe choice — calling `git fetch --tags --depth=...` with a
          # bounded depth is fragile when the previous tag is far back.
          fetch-depth: 0
          # rc16: when chained via workflow_run, checkout@v4 defaults to
          # the workflow file's own branch (typically the default branch),
          # NOT the head_sha of the triggering workflow. Pass the upstream
          # sha explicitly so we build the same commit the Rust artifact
          # was produced from. For other triggers this evaluates to '' and
          # checkout uses its default (current ref = the tag for push.tags).
          ref: ${{ github.event.workflow_run.head_sha }}

      # ---------------------------------------------------------------------
      # 1b. Wait for upstream Rust workflow (rc17.1.1 Stream BE)
      # ---------------------------------------------------------------------
      # On tag push, this bundler is queued by `push.tags` IMMEDIATELY
      # — but `build-recorder-rust.yml` (which produces the Rust EXE
      # artifact we download below) is also just starting. The
      # original race that motivated Stream BA was: bundler hit the
      # `gh run download` step at ~6 min, Rust was still 7 min from
      # done, download failed with "no matching workflow run found".
      #
      # This step polls until Rust finishes (success → continue,
      # failure/cancelled → abort bundler so we don't ship a half-baked
      # installer). On workflow_dispatch (smoke) we skip — no upstream
      # Rust run is expected for synthetic tags. On workflow_run (rc16
      # branch CI) we also skip — the trigger itself guarantees
      # upstream success via the job-level `if:` gate.
      - name: Wait for upstream Rust workflow to succeed
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/recorder-v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          MAX_WAIT_MIN=30
          POLL_SECONDS=30
          deadline=$(( $(date +%s) + MAX_WAIT_MIN*60 ))
          echo "Polling build-recorder-rust.yml on commit $COMMIT_SHA (max ${MAX_WAIT_MIN}min, every ${POLL_SECONDS}s)"
          while [ "$(date +%s)" -lt "$deadline" ]; do
            out=$(gh run list --workflow=build-recorder-rust.yml \
                              --commit "$COMMIT_SHA" \
                              --json status,conclusion,databaseId \
                              --limit 1 2>/dev/null || echo '[]')
            status=$(echo "$out" | jq -r '.[0].status // "missing"')
            conclusion=$(echo "$out" | jq -r '.[0].conclusion // "null"')
            run_id=$(echo "$out" | jq -r '.[0].databaseId // "?"')
            echo "[$(date -u +%H:%M:%S)] rust run=$run_id status=$status conclusion=$conclusion"
            case "$conclusion" in
              success)
                echo "✓ Upstream Rust workflow succeeded — bundler may proceed."
                exit 0
                ;;
              failure|cancelled|timed_out|action_required|startup_failure|stale)
                echo "✗ Upstream Rust workflow ended in '$conclusion' — aborting bundler."
                exit 1
                ;;
              null|"")
                # Still running (status=in_progress|queued|waiting) or missing run.
                ;;
            esac
            sleep "$POLL_SECONDS"
          done
          echo "✗ Upstream Rust workflow did not succeed within ${MAX_WAIT_MIN}min — aborting."
          exit 1

      # ---------------------------------------------------------------------
      # 2. Resolve the version we're building
      # ---------------------------------------------------------------------
      # On a tag push: TAG = github.ref_name (e.g. "recorder-v1.2.3"),
      #                VERSION = the bit after the prefix (e.g. "1.2.3").
      # On workflow_dispatch (smoke): TAG = inputs.smoke_tag (e.g. "v0.0.0-smoke"),
      #                               VERSION = same minus any leading "v".
      # All downstream steps reference $env:RELEASE_TAG and $env:APP_VERSION
      # so neither code path special-cases below this step.
      #
      # SECURITY: SMOKE_TAG_INPUT is read from workflow_dispatch user input
      # via env, NEVER inlined into the script body — that would be a
      # command-injection sink if anyone with workflow_dispatch perms ever
      # types something cute into the form.
      - name: Resolve release tag + app version
        id: version
        shell: pwsh
        env:
          SMOKE_TAG_INPUT: ${{ github.event.inputs.smoke_tag }}
          # rc16: when chained via workflow_run, GITHUB_REF is the default
          # branch — we need the upstream-workflow's branch + sha instead.
          WORKFLOW_RUN_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          WORKFLOW_RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          # rc17.0.4 (Stream BA): when upstream Rust workflow was triggered
          # by a tag push, workflow_run.event is 'push' AND head_branch is
          # the tag name (since tag refs have no branch context). We use
          # this to detect "upstream was a tag push" without a direct
          # `push.tags` trigger on this workflow, which was the source of
          # the race condition that broke every rc17.x ship.
          WORKFLOW_RUN_EVENT: ${{ github.event.workflow_run.event }}
        run: |
          if ($env:GITHUB_EVENT_NAME -eq 'push' -and $env:GITHUB_REF -match '^refs/tags/recorder-v') {
            # rc17.1.1 (Stream BE, Howard 2026-05-12): direct tag push.
            # This is the primary trigger path after the workflow_run-only
            # regression broke rc17.0.5/rc17.1. The Wait-for-Rust step
            # earlier in this job ensures the Rust artifact is already
            # uploaded by the time we hit the artifact download below.
            $tag = $env:GITHUB_REF_NAME
            $version = $tag -replace '^recorder-v', ''
            $isRelease = 'true'
          } elseif ($env:GITHUB_EVENT_NAME -eq 'workflow_run' -and $env:WORKFLOW_RUN_HEAD_BRANCH -eq 'recorder-v0.28.0-rc16') {
            # rc16 (Howard 2026-05-11): branch-push CI build, chained after
            # build-recorder-rust.yml succeeded. Synthesize a version string
            # so all downstream filename logic still works, but mark
            # IS_RELEASE=false so we don't upload to a non-existent GitHub
            # Release. The artifact upload at the end of this workflow
            # still runs so we can download + inspect the built installer
            # from the workflow run page.
            # Use dash-separated semver pre-release form (no `+` build
            # metadata) so Inno Setup's OutputBaseFilename + filesystem
            # path handling stay vanilla. The Pascal trick that derives
            # VersionInfoVersion via `Copy(AppVersion, 1, Pos("-", ...)-1)`
            # still truncates everything from the first `-`, yielding
            # VersionInfoVersion=0.28.0.0 - Windows-resource-API-valid.
            #
            # rc17.0.4 (Stream BA): this branch case MUST be checked BEFORE
            # the tag-push case below, because the rc16 BRANCH name
            # (recorder-v0.28.0-rc16) also matches the tag regex
            # ^recorder-v\d. Order matters: exact rc16 branch first, then
            # the catch-all tag pattern.
            $shortSha = $env:WORKFLOW_RUN_HEAD_SHA.Substring(0,7)
            $tag = "recorder-v0.28.0-rc16-$shortSha"
            $version = "0.28.0-rc16-$shortSha"
            $isRelease = 'false'
          } elseif ($env:GITHUB_EVENT_NAME -eq 'workflow_run' -and `
                    $env:WORKFLOW_RUN_EVENT -eq 'push' -and `
                    $env:WORKFLOW_RUN_HEAD_BRANCH -match '^recorder-v\d') {
            # rc17.0.4 (Stream BA): upstream was a `recorder-v*` tag push.
            # The "branch" reported here is actually the tag name (refs to
            # tags carry no branch context). Treat as full release - this
            # is the path that replaces the old `push: tags: recorder-v*`
            # direct trigger. By gating on WORKFLOW_RUN_EVENT='push' AND
            # the tag pattern, we ignore workflow_run firings for branch
            # pushes / workflow_dispatch of the Rust workflow. The rc16
            # branch case above pre-empts this so we never misclassify a
            # branch CI build as a release.
            $tag = $env:WORKFLOW_RUN_HEAD_BRANCH
            $version = $tag -replace '^recorder-v', ''
            $isRelease = 'true'
          } else {
            $tag = $env:SMOKE_TAG_INPUT
            if ([string]::IsNullOrWhiteSpace($tag)) { $tag = 'v0.0.0-smoke' }
            # Reject anything that isn't a tame version-ish identifier so
            # downstream filenames / gh CLI args can't be hijacked.
            if ($tag -notmatch '^[A-Za-z0-9._\-]+$') {
              Write-Error "Refusing smoke_tag '$tag' - must match ^[A-Za-z0-9._-]+$"
              exit 1
            }
            $version = $tag -replace '^v', ''
            $isRelease = 'false'
          }
          if ([string]::IsNullOrWhiteSpace($version)) {
            Write-Error "Could not resolve a non-empty version from tag '$tag'"
            exit 1
          }
          Write-Host "RELEASE_TAG = $tag"
          Write-Host "APP_VERSION = $version"
          Write-Host "IS_RELEASE  = $isRelease"
          "RELEASE_TAG=$tag"     | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "APP_VERSION=$version" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "IS_RELEASE=$isRelease"| Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      # ---------------------------------------------------------------------
      # 3. Toolchain — Python 3.12 + PyInstaller
      # ---------------------------------------------------------------------
      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          # PyInstaller drives both R05C (OysterPlay.exe compile) and the
          # OysterRecorder onedir step. Keep this list narrow — anything
          # the recorder needs at runtime (depth-anything, pynput, etc.)
          # will be pulled in by recorder_consumer_lite.py via PyInstaller's
          # --collect-all directives, not pinned at the workflow level.
          pip install "pyinstaller>=6.0"
          pip install pynput pillow numpy pyyaml
          # rc15.31 (Howard "用视频录制器解决"): mss for DXGI Desktop
          # Duplication capture — handles MC exclusive fullscreen where
          # gdigrab freezes and ddagrab failed with -22 on AMD 780M.
          pip install mss
          # rc15.7.2 (Round 10 H2 finding): pin torch==2.4.1 explicitly to
          # match torch-directml 0.2.5's hard requirement. Was bug: install
          # latest cpu-torch (2.11.0+cpu) then torch-directml DOWNGRADED to
          # 2.4.1 (no +cpu suffix → may pull CUDA-bundled wheel = +1.5GB
          # bundle bloat + transformers compat risk). Pin first, install dml
          # second, transformers last — deterministic resolution chain.
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.4.1 torchvision==0.19.1
          # rc15.6 (Howard 2026-05-09 "我只有 amd"): bundle torch-directml so
          # AMD/Intel GPU users can run DepthAnything V2 via DirectML on
          # Windows. No-op on machines without DX12 GPU (falls back to cpu).
          pip install torch-directml
          # rc15.9 self-heal v2: also bundle onnxruntime-directml as
          # inner-tier 3 fallback. ONNX op coverage on DML is wider than
          # torch_directml's, resolves AMD 780M × DepthAnything V2
          # model_compat error seen in rc15.8 testing.
          pip install onnxruntime-directml
          pip install transformers "imageio[ffmpeg]" OpenEXR Imath huggingface_hub
          python -c "import PyInstaller, sys; print(f'PyInstaller {PyInstaller.__version__} on Python {sys.version.split()[0]}')"

      # ---------------------------------------------------------------------
      # 4. Toolchain — Inno Setup (Windows-only via Chocolatey)
      # ---------------------------------------------------------------------
      - name: Install Inno Setup via Chocolatey
        shell: pwsh
        run: |
          # GitHub-hosted windows-latest runners have choco preinstalled.
          # `--no-progress` keeps the CI log readable; `-y` accepts EULA.
          choco install innosetup -y --no-progress
          # Sanity: locate iscc.exe and put its dir on PATH for later steps.
          $iscc = Get-Command iscc.exe -ErrorAction SilentlyContinue
          if (-not $iscc) {
            $candidates = @(
              "$env:ProgramFiles\Inno Setup 6\ISCC.exe",
              "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
            )
            $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
            if (-not $iscc) {
              Write-Error "iscc.exe not found after choco install innosetup"
              exit 1
            }
            $isccDir = Split-Path -Parent $iscc
            "$isccDir" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
            Write-Host "Added $isccDir to PATH"
          }
          iscc.exe /? | Select-Object -First 5

      # ---------------------------------------------------------------------
      # 5. Caches — JRE, MC, Fabric blobs are content-pinned via manifest.json
      # ---------------------------------------------------------------------
      - name: Cache bundled-installer fetch artifacts
        uses: actions/cache@v4
        with:
          # All three fetch_*.py scripts default to bin/.cache/<kind>/.
          # A single cache entry keyed on the manifest hash invalidates the
          # whole bundle the moment any pin bumps — which is exactly the
          # behavior we want, because a bumped pin means the SHA changed
          # and the cached blob would fail verification anyway.
          path: |
            bin/.cache/jre
            bin/.cache/mc
            bin/.cache/fabric
          key: bundled-installer-${{ runner.os }}-${{ hashFiles('bin/build_bundled_installer/manifest.json') }}
          restore-keys: |
            bundled-installer-${{ runner.os }}-

      # ---------------------------------------------------------------------
      # 6. R05A — fetch + verify Eclipse Temurin OpenJDK 21 LTS JRE
      # ---------------------------------------------------------------------
      - name: R05A — Fetch JRE (Temurin 21 LTS)
        shell: pwsh
        run: |
          python bin/build_bundled_installer/fetch_jre.py
          if (-not (Test-Path 'bundle/jre/bin/javaw.exe')) {
            Write-Error "R05A invariant violated: bundle/jre/bin/javaw.exe missing after fetch_jre.py exited 0"
            exit 1
          }
          $size_mb = [math]::Round((Get-ChildItem -Recurse bundle/jre | Measure-Object -Property Length -Sum).Sum / 1MB, 1)
          Write-Host "JRE staged at bundle/jre/ (${size_mb} MB)"

      # ---------------------------------------------------------------------
      # 7. R05B — fetch + verify vanilla Minecraft 1.21.4 client + libs
      # ---------------------------------------------------------------------
      - name: R05B — Fetch vanilla Minecraft 1.21.4
        shell: pwsh
        run: |
          python bin/build_bundled_installer/fetch_minecraft.py
          $required = @(
            'bundle/mc-instance/versions/1.21.4/1.21.4.jar',
            'bundle/mc-instance/versions/1.21.4/1.21.4.json',
            'bundle/mc-instance/assets/indexes/19.json'
          )
          foreach ($f in $required) {
            if (-not (Test-Path $f)) {
              Write-Error "R05B invariant violated: required file missing after fetch_minecraft.py: $f"
              exit 1
            }
          }
          $libs = Get-ChildItem -Recurse bundle/mc-instance/libraries -ErrorAction SilentlyContinue
          $size_mb = [math]::Round((Get-ChildItem -Recurse bundle/mc-instance | Measure-Object -Property Length -Sum).Sum / 1MB, 1)
          Write-Host "MC libraries: $($libs.Count) files, ${size_mb} MB"

      # ---------------------------------------------------------------------
      # 8. R05B — fetch + verify Fabric loader 0.16.10 for MC 1.21.4
      # ---------------------------------------------------------------------
      - name: R05B — Fetch Fabric loader 0.16.10
        shell: pwsh
        run: |
          python bin/build_bundled_installer/fetch_fabric.py
          $fabricProfile = 'bundle/mc-instance/versions/fabric-loader-0.16.10-1.21.4/fabric-loader-0.16.10-1.21.4.json'
          if (-not (Test-Path $fabricProfile)) {
            Write-Error "R05B invariant violated: fabric profile missing: $fabricProfile"
            exit 1
          }

      # ---------------------------------------------------------------------
      # 9. R05C — compile OysterPlay.py → OysterPlay.exe
      # ---------------------------------------------------------------------
      - name: R05C — Build OysterPlay.exe (consumer launcher)
        shell: pwsh
        run: |
          python bin/build_bundled_installer/build_oysterplay_exe.py --onefile --clean
          if (-not (Test-Path 'dist/OysterPlay.exe')) {
            Write-Error "R05C invariant violated: dist/OysterPlay.exe missing after build_oysterplay_exe.py exited 0"
            exit 1
          }
          $size_mb = [math]::Round((Get-Item 'dist/OysterPlay.exe').Length / 1MB, 1)
          Write-Host "OysterPlay.exe = ${size_mb} MB"

      # ---------------------------------------------------------------------
      # 10. Build mc-mod jars INLINE (deterministic — same tag, same commit)
      # ---------------------------------------------------------------------
      # rc19.0.2: Previously we downloaded mod jars from the build-mc-mod
      # workflow's artifacts via dawidd6/action-download-artifact. That
      # pulled the LATEST successful run on `main`, which could be days-old
      # and stale (rc19.0.1 shipped a jar with 18-param GameStateSample
      # constructor instead of the 19-param version with weather + timeOfDay).
      #
      # Fix: build mc-mod inline from the SAME commit this tag points to.
      # This is +~3 min build time but guarantees the jar matches the
      # source at this exact tag. No more stale artifact risk.
      #
      # The 1.21.4 jar gets bundled inside the installer (matches the
      # bundled MC instance version). The other 8 jars get uploaded
      # alongside the installer for advanced users who want a different
      # MC version (R05E acceptance: "9 个 mod jars (单独 download for
      # advanced users)").
      - name: Setup Java 21 (for inline mc-mod build)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Build mc-mod jars inline (all 9 MC versions)
        shell: pwsh
        run: |
          # Build the Fabric mod for all 9 supported MC versions from the
          # source checked out at this tag's commit. This guarantees the
          # jar matches the exact source at this tag — no stale artifacts.
          #
          # rc19.0.2.1 (Howard 2026-05-13): Howard's minipc1 ran a session
          # against the rc19.0.2 installer and the recorded
          # game_state.jsonl came back with 18 fields (no weather, no
          # time_of_day). Root cause analysis: the inline build below
          # was using gradle's per-task build cache + incremental compile
          # avoidance, so when MC_VERSION rotated between iterations, the
          # *Java compile output* could be reused from a previous iteration's
          # cache snapshot (build/classes/java/main/ persists across
          # iterations because we Push/Pop into mc-mod with the SAME working
          # tree). That kept the compiled GameStateSample.class from the
          # FIRST iteration's javac output if loom's task graph thought
          # nothing changed. Adding --no-build-cache disables Gradle's
          # remote-and-local build cache, and --rerun-tasks force-reruns
          # every task ignoring up-to-date checks. Combined with an explicit
          # `clean` before each MC version build, the only build/libs jar
          # this iteration produces is from a fresh javac pass over the
          # checked-out source. (Loom's mapping-jar caches in ~/.gradle/loom
          # remain cached — those are version-pinned per MC_VERSION and are
          # safe to reuse; we only invalidate THIS project's output.)
          $mcVersions = @(
            '1.20.1', '1.20.2', '1.20.4', '1.20.6',
            '1.21.1', '1.21.2', '1.21.3', '1.21.4', '1.21.5'
          )
          New-Item -ItemType Directory -Force -Path 'mod-jars' | Out-Null
          foreach ($mcVer in $mcVersions) {
            Write-Host "=== Building mc-mod for MC $mcVer ==="
            $env:MC_VERSION = $mcVer
            Push-Location mc-mod
            try {
              # Bootstrap gradlew if missing (no gradle wrapper in repo)
              if (-not (Test-Path 'gradlew')) {
                Write-Host "Bootstrapping gradle wrapper..."
                gradle wrapper --gradle-version 8.10
              }
              # rc19.0.2.1 fail-loud: clean+rerun every task, never reuse
              # cached compile output across MC versions. -q would hide the
              # diagnostic prints if anything goes sideways; we keep default
              # verbosity for the rebuild path. --no-daemon prevents
              # daemon-pinned classloader state from leaking across iterations.
              ./gradlew clean --no-daemon
              if ($LASTEXITCODE -ne 0) {
                Write-Error "gradle clean failed for MC $mcVer"
                exit 1
              }
              ./gradlew build --no-daemon --no-build-cache --rerun-tasks
              if ($LASTEXITCODE -ne 0) {
                Write-Error "gradle build failed for MC $mcVer"
                exit 1
              }
              $jar = Get-ChildItem build/libs -Filter "oyster-recorder-mod-*-mc${mcVer}.jar" `
                       | Where-Object { $_.Name -notmatch 'sources' -and $_.Name -notmatch 'javadoc' } `
                       | Select-Object -First 1
              if (-not $jar) {
                Write-Error "No jar produced for MC $mcVer"
                exit 1
              }
              Copy-Item $jar.FullName -Destination "../mod-jars/" -Force
              $size_kb = [math]::Round($jar.Length / 1KB, 1)
              Write-Host "  OK: $($jar.Name) (${size_kb} KB)"
            } finally {
              Pop-Location
            }
          }
          $jarCount = (Get-ChildItem 'mod-jars' -Filter '*.jar').Count
          Write-Host "Built $jarCount mod jars total"
          if ($jarCount -lt 9) {
            Write-Error "Expected 9 mod jars, found $jarCount"
            exit 1
          }

      - name: Verify mc-mod jar constructor signature (must include weather + timeOfDay)
        shell: pwsh
        run: |
          # rc19.0.2.1 (Howard 2026-05-13): rc19.0.2 shipped with this
          # verification PASSING but the recorded game_state.jsonl on
          # minipc1 still had 18 fields. Root cause: the previous regex
          # `'Ljava/lang/String;' x4` matched four `String` descriptors
          # ANYWHERE in the bytecode — including unrelated methods such
          # as `toJsonLine()`, `appendKvStr()`, accessor methods,
          # `toString()`, and the constant pool. With weather/timeOfDay
          # strings present in the constant pool from record-accessor
          # method names alone, the old check could pass against an
          # 18-field constructor whose only Strings were dimension/gameMode.
          # We now verify the canonical constructor's descriptor
          # specifically, by extracting the `<init>` method's
          # NameAndType descriptor from the constant pool. ALL 9 mod
          # jars are verified — not just 1.21.4 — because they all
          # build from the same Java source.
          #
          # Iron-law: this gate is INFORMATIONAL ONLY when the source
          # changes (you'd update the expected counts here in the same
          # commit). It's STRUCTURAL when the build path is suspect
          # (stale jar / cache / wrong source) — it catches exactly
          # the regression we shipped in rc19.0.2.
          $allJars = Get-ChildItem 'mod-jars' -Filter '*.jar' `
                       | Where-Object { $_.Name -notmatch 'sources' -and $_.Name -notmatch 'javadoc' }
          if ($allJars.Count -lt 9) {
            Write-Error "Expected 9 mod jars to verify, found $($allJars.Count)"
            exit 1
          }
          # Expected record field count: 20 (see comment at original site
          # for the breakdown). Two of those 20 are the weather + timeOfDay
          # additions in rc18.0.8 that distinguish the new schema from
          # the old 18-field schema.
          $expectedFieldCount = 20
          $expectedWeatherIdx = 17  # 0-indexed: weather is the 18th field
          $expectedTimeOfDayIdx = 18 # 0-indexed: timeOfDay is the 19th field

          foreach ($jar in $allJars) {
            Write-Host "Verifying $($jar.Name)..."
            $tmpDir = Join-Path $env:TEMP "mcmod-verify-$([guid]::NewGuid())"
            New-Item -ItemType Directory -Force -Path $tmpDir | Out-Null
            try {
              # Extract just the class we care about. Use shell-out to PowerShell's
              # zip handling — Expand-Archive copies the entire jar; we only
              # need a single class file.
              Expand-Archive -Path $jar.FullName -DestinationPath $tmpDir -Force
              $classFile = Join-Path $tmpDir 'world/oyster/recorder/GameStateSample.class'
              if (-not (Test-Path $classFile)) {
                Write-Error "FAIL: GameStateSample.class not found in $($jar.Name)"
                exit 1
              }

              # Strict bytecode check: parse the constant pool, find the
              # canonical `<init>` method's descriptor, and assert it has
              # the exact field-count and String positions we expect.
              #
              # ClassFile structure (JVM spec §4.1):
              #   u4 magic = 0xCAFEBABE
              #   u2 minor_version
              #   u2 major_version
              #   u2 constant_pool_count
              #   cp_info constant_pool[constant_pool_count - 1]
              # We scan the constant pool for CONSTANT_Utf8 entries
              # (tag = 1) that match `<init>` descriptors. The descriptor
              # format `(JJDDDFFDDDDDDDZZZLjava/lang/String;...)V` has a
              # well-defined parser: count each parameter type token.
              $bytes = [System.IO.File]::ReadAllBytes($classFile)
              if ($bytes.Length -lt 10 -or $bytes[0] -ne 0xCA -or $bytes[1] -ne 0xFE `
                  -or $bytes[2] -ne 0xBA -or $bytes[3] -ne 0xBE) {
                Write-Error "FAIL: $($jar.Name) GameStateSample.class missing CAFEBABE magic"
                exit 1
              }
              # Constant pool count = u2 at offset 8 (after magic + minor + major)
              $cpCount = ([int]$bytes[8] -shl 8) -bor [int]$bytes[9]
              $offset = 10
              $utf8Entries = New-Object 'System.Collections.Generic.List[string]'
              # constant_pool is 1-indexed in the JVM spec; we walk 1..(cpCount-1)
              $idx = 1
              while ($idx -lt $cpCount) {
                $tag = [int]$bytes[$offset]
                $offset++
                switch ($tag) {
                  1 {  # CONSTANT_Utf8
                    $len = ([int]$bytes[$offset] -shl 8) -bor [int]$bytes[$offset+1]
                    $offset += 2
                    $str = [System.Text.Encoding]::UTF8.GetString($bytes, $offset, $len)
                    $utf8Entries.Add($str)
                    $offset += $len
                  }
                  7  { $offset += 2 }   # CONSTANT_Class
                  8  { $offset += 2 }   # CONSTANT_String
                  9  { $offset += 4 }   # CONSTANT_Fieldref
                  10 { $offset += 4 }   # CONSTANT_Methodref
                  11 { $offset += 4 }   # CONSTANT_InterfaceMethodref
                  12 { $offset += 4 }   # CONSTANT_NameAndType
                  15 { $offset += 3 }   # CONSTANT_MethodHandle
                  16 { $offset += 2 }   # CONSTANT_MethodType
                  17 { $offset += 4 }   # CONSTANT_Dynamic
                  18 { $offset += 4 }   # CONSTANT_InvokeDynamic
                  19 { $offset += 2 }   # CONSTANT_Module
                  20 { $offset += 2 }   # CONSTANT_Package
                  3  { $offset += 4 }   # CONSTANT_Integer
                  4  { $offset += 4 }   # CONSTANT_Float
                  5  { $offset += 8; $idx++ } # CONSTANT_Long (takes 2 cp slots)
                  6  { $offset += 8; $idx++ } # CONSTANT_Double (takes 2 cp slots)
                  default {
                    Write-Error "FAIL: $($jar.Name) unknown constant_pool tag $tag at idx $idx (offset $offset)"
                    exit 1
                  }
                }
                $idx++
              }

              # Find the canonical record constructor descriptor. A record's
              # canonical ctor is the only `<init>` whose descriptor matches
              # the field type list. We look for any utf8 entry beginning
              # with `(` and ending with `)V` that ALSO contains both
              # `dimension`'s placement and the weather+timeOfDay positions.
              # Easier: parse every `(....)V` descriptor and pick the one
              # with the maximum parameter count (the canonical record ctor
              # in a Fabric mod jar dominates all other `<init>` overloads,
              # which are at most 1-2 params).
              $ctorDescriptors = $utf8Entries | Where-Object {
                $_ -match '^\(.*\)V$'
              }
              if ($ctorDescriptors.Count -lt 1) {
                Write-Error "FAIL: $($jar.Name) no (...)V descriptors found in constant pool"
                exit 1
              }

              # Parse a JVM method descriptor's parameter list into a token array.
              # Tokens: B C D F I J S Z (primitives), L<name>; (objects), [<token> (arrays).
              function Get-DescriptorParams([string]$desc) {
                $params = @()
                $body = $desc.Substring(1, $desc.LastIndexOf(')') - 1)
                $i = 0
                while ($i -lt $body.Length) {
                  $ch = $body[$i]
                  if ($ch -eq 'L') {
                    $semi = $body.IndexOf(';', $i)
                    if ($semi -lt 0) { return $null }
                    $params += $body.Substring($i, $semi - $i + 1)
                    $i = $semi + 1
                  } elseif ($ch -eq '[') {
                    $j = $i
                    while ($j -lt $body.Length -and $body[$j] -eq '[') { $j++ }
                    if ($body[$j] -eq 'L') {
                      $semi = $body.IndexOf(';', $j)
                      if ($semi -lt 0) { return $null }
                      $params += $body.Substring($i, $semi - $i + 1)
                      $i = $semi + 1
                    } else {
                      $params += $body.Substring($i, $j - $i + 1)
                      $i = $j + 1
                    }
                  } elseif ('BCDFIJSZV'.IndexOf($ch) -ge 0) {
                    $params += [string]$ch
                    $i++
                  } else {
                    return $null  # malformed
                  }
                }
                return ,$params
              }

              # Find the (...)V descriptor with the largest param count — that's the canonical ctor.
              $maxParams = -1
              $canonicalParams = $null
              $canonicalDesc = $null
              foreach ($d in $ctorDescriptors) {
                $p = Get-DescriptorParams $d
                if ($p -eq $null) { continue }
                if ($p.Count -gt $maxParams) {
                  $maxParams = $p.Count
                  $canonicalParams = $p
                  $canonicalDesc = $d
                }
              }
              if ($canonicalParams -eq $null) {
                Write-Error "FAIL: $($jar.Name) could not parse any constructor descriptor"
                exit 1
              }

              if ($canonicalParams.Count -ne $expectedFieldCount) {
                Write-Error "FAIL: $($jar.Name) canonical <init> has $($canonicalParams.Count) params, expected $expectedFieldCount"
                Write-Error "       descriptor: $canonicalDesc"
                Write-Error "       This is the EXACT regression rc19.0.2 shipped (stale 18-param jar)."
                exit 1
              }
              if ($canonicalParams[$expectedWeatherIdx] -ne 'Ljava/lang/String;') {
                Write-Error "FAIL: $($jar.Name) param[$expectedWeatherIdx] (weather) = '$($canonicalParams[$expectedWeatherIdx])', expected 'Ljava/lang/String;'"
                exit 1
              }
              if ($canonicalParams[$expectedTimeOfDayIdx] -ne 'Ljava/lang/String;') {
                Write-Error "FAIL: $($jar.Name) param[$expectedTimeOfDayIdx] (timeOfDay) = '$($canonicalParams[$expectedTimeOfDayIdx])', expected 'Ljava/lang/String;'"
                exit 1
              }
              # weather + timeOfDay field NAMES must also appear in the
              # constant pool (record field names are stored as Utf8 entries
              # for the canonical accessor methods). If a stale build
              # somehow has the right ctor shape but wrong field names, this
              # catches it.
              if (-not $utf8Entries.Contains('weather')) {
                Write-Error "FAIL: $($jar.Name) constant pool missing 'weather' Utf8 entry"
                exit 1
              }
              if (-not $utf8Entries.Contains('timeOfDay')) {
                Write-Error "FAIL: $($jar.Name) constant pool missing 'timeOfDay' Utf8 entry"
                exit 1
              }
              Write-Host "  OK: canonical <init> = $canonicalDesc"
              Write-Host "  OK: param count = $($canonicalParams.Count) (expected $expectedFieldCount)"
              Write-Host "  OK: weather (param[$expectedWeatherIdx]) + timeOfDay (param[$expectedTimeOfDayIdx]) are String"
              Write-Host "  OK: 'weather' + 'timeOfDay' Utf8 entries present in constant pool"
            } finally {
              Remove-Item -Recurse -Force $tmpDir -ErrorAction SilentlyContinue
            }
          }
          Write-Host "All $($allJars.Count) mod jars VERIFIED — none is stale, all have weather + timeOfDay fields"

      - name: Stage mod jars (all 9 into bundle + release-extras)
        shell: pwsh
        run: |
          # All 9 mod jars (one per supported MC version) go into the
          # bundled mods dir so the bundled installer ships the full set —
          # users can switch which MC version they target without
          # re-downloading. The same 9 jars also go to release-extras/ for
          # the standalone-mod-jar download path on the Release page.
          New-Item -ItemType Directory -Force -Path 'bundle/mc-instance/mods' | Out-Null
          New-Item -ItemType Directory -Force -Path 'release-extras' | Out-Null
          $allJars = Get-ChildItem -Recurse mod-jars -Filter '*.jar' `
                       | Where-Object { $_.Name -notmatch '-sources' -and $_.Name -notmatch '-javadoc' }
          if ($allJars.Count -lt 9) {
            Write-Error "Expected 9 mod jars across MC versions, found $($allJars.Count)"
            exit 1
          }
          # De-dupe by filename (in case of any duplicates).
          $seen = @{}
          foreach ($jar in $allJars) {
            if ($seen.ContainsKey($jar.Name)) { continue }
            $seen[$jar.Name] = $true
            Copy-Item $jar.FullName -Destination 'release-extras/' -Force
            Copy-Item $jar.FullName -Destination 'bundle/mc-instance/mods/' -Force
          }
          $bundleCount = (Get-ChildItem 'bundle/mc-instance/mods' -Filter '*.jar').Count
          $extraCount  = (Get-ChildItem 'release-extras' -Filter '*.jar').Count
          Write-Host "Bundled mods: $bundleCount (in bundle/mc-instance/mods/)"
          Write-Host "Release-extras: $extraCount (uploaded as standalone Release assets)"
          if ($bundleCount -lt 9) {
            Write-Error "After staging only $bundleCount mod jars in bundle, expected 9"
            exit 1
          }

      # ---------------------------------------------------------------------
      # 11. Build the OysterRecorder onedir (recorder_consumer_lite.py)
      # ---------------------------------------------------------------------
      # Mirrors `build-recorder-exe.yml`'s --onedir branch. We only need the
      # onedir form for the bundled installer (Inno Setup ships a folder,
      # not a wrapped single-file .exe), so we skip the --onefile build
      # entirely here.
      - name: Pre-download DepthAnything V2 weights
        shell: pwsh
        run: |
          python -c "from huggingface_hub import snapshot_download; snapshot_download(repo_id='depth-anything/Depth-Anything-V2-Small-hf', local_dir='hf_cache/depth-anything-v2-small-hf')"

      - name: Download ffmpeg (Windows x64, GPL static)
        shell: pwsh
        run: |
          $url = 'https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip'
          Invoke-WebRequest -Uri $url -OutFile ffmpeg.zip
          Expand-Archive -Path ffmpeg.zip -DestinationPath ffmpeg-extracted -Force
          $ffmpegBin = Get-ChildItem -Recurse ffmpeg-extracted -Filter 'ffmpeg.exe' | Select-Object -First 1
          Copy-Item $ffmpegBin.FullName -Destination 'ffmpeg.exe' -Force

      - name: Download Fabric installer jar
        shell: pwsh
        run: |
          $url = 'https://maven.fabricmc.net/net/fabricmc/fabric-installer/1.0.1/fabric-installer-1.0.1.jar'
          Invoke-WebRequest -Uri $url -OutFile fabric-installer.jar

      - name: Build OysterRecorder onedir (PyInstaller)
        shell: pwsh
        run: |
          # Single mod jar copy for the onedir install — this matches D17's
          # behavior so the recorder can write its own copy alongside the
          # user's MC if they ever launch outside the bundled instance.
          # Pick the 1.21.4 jar (matches the bundled MC version).
          $modJar = Get-ChildItem 'bundle/mc-instance/mods' -Filter '*-mc1.21.4.jar' `
                       | Select-Object -First 1
          if (-not $modJar) {
            Write-Error "Could not find a 1.21.4 mod jar to bundle into the recorder onedir"
            exit 1
          }
          Copy-Item $modJar.FullName -Destination 'oyster-recorder-mod.jar' -Force
          # PyInstaller's --distpath drops OysterRecorder-onedir directly
          # into bundle/ — exactly where installer.iss's [Files] line
          # `Source: "{#BundleRoot}\\OysterRecorder-onedir\\*"` looks for it.
          pyinstaller --onedir --windowed `
            --name OysterRecorder-onedir `
            --distpath bundle `
            --workpath build/OysterRecorder-onedir `
            --add-binary "ffmpeg.exe;." `
            --add-data "bin/lint_v3_prd_grounded.py;." `
            --add-data "bin/generate_systeminfo_json.py;." `
            --add-data "bin/generate_gameinfo_xlsx.py;." `
            --add-data "bin/depth_anything_v2_inference.py;." `
            --add-data "bin/install_fabric_loader.py;." `
            --add-data "bin/game_state_overlay.py;." `
            --add-data "bin/heal_registry.py;." `
            --add-data "bin/heal_report.py;." `
            --add-data "bin/preflight_capture.py;." `
            --add-data "bin/env_sanity.py;." `
            --add-data "bin/diag_uploader.py;." `
            --add-data "fabric-installer.jar;." `
            --add-data "oyster-recorder-mod.jar;." `
            --add-data "hf_cache;hf_cache" `
            --paths bin `
            --collect-all tkinter `
            --collect-all pynput `
            --collect-all numpy `
            --collect-all PIL `
            --collect-all yaml `
            --collect-all torch `
            --collect-all torch_directml `
            --collect-all onnxruntime `
            --collect-submodules depth_runtimes `
            --collect-all transformers `
            --collect-all OpenEXR `
            --collect-all Imath `
            --collect-all imageio `
            --collect-all imageio_ffmpeg `
            --hidden-import pynput.keyboard._win32 `
            --hidden-import pynput.mouse._win32 `
            --hidden-import lint_v3_prd_grounded `
            --hidden-import generate_systeminfo_json `
            --hidden-import generate_gameinfo_xlsx `
            --hidden-import depth_anything_v2_inference `
            --hidden-import install_fabric_loader `
            --hidden-import game_state_overlay `
            --hidden-import heal_registry `
            --hidden-import heal_report `
            --hidden-import preflight_capture `
            --hidden-import env_sanity `
            --hidden-import diag_uploader `
            --hidden-import mss `
            --hidden-import mss.windows `
            --hidden-import PIL.Image `
            bin/recorder_consumer_lite.py
          if (-not (Test-Path 'bundle/OysterRecorder-onedir/OysterRecorder-onedir.exe')) {
            Write-Error "PyInstaller did not produce bundle/OysterRecorder-onedir/OysterRecorder-onedir.exe"
            exit 1
          }

      # ---------------------------------------------------------------------
      # 11b. rc16: pull Rust+OBS recorder artifact from build-recorder-rust.yml
      # ---------------------------------------------------------------------
      # Architecture pivot: the Rust recorder is the PRIMARY screen-capture
      # path (Python recorder above is now the FALLBACK). We download the
      # artifact produced by build-recorder-rust.yml's most recent successful
      # run on the same ref and stage it at bundle/recorder/. installer.iss
      # ships that directly to {app}/recorder/ — the path oyster_play.py's
      # find_recorder_exe() checks first.
      #
      # Why download-artifact instead of building inline: the Rust build
      # adds ~15-25 min (cargo + cargo-obs-build) on top of the already
      # 22-28 min Python pipeline. Keeping them in separate workflows means
      # the Rust artifact can be cached + reused, and either workflow can
      # be re-run independently if one path breaks.
      - name: rc16 - Download Rust recorder artifact (from build-recorder-rust.yml)
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: build-recorder-rust.yml
          workflow_conclusion: success
          # rc16: pin to the SAME commit the Rust workflow built from.
          # When chained via workflow_run, github.sha resolves to the
          # default branch HEAD (a checkout@v4 quirk), so we use the
          # workflow_run head_sha explicitly. For tag pushes / dispatch
          # the workflow_run context is empty, so github.sha is correct.
          commit: ${{ github.event.workflow_run.head_sha || github.sha }}
          name_is_regexp: true
          name: '^OysterRecorder-rust-.*'
          path: rust-recorder-artifact
          if_no_artifact_found: fail
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: rc16 - Stage Rust recorder under bundle/recorder/
        shell: pwsh
        run: |
          # action-download-artifact unpacks each matched artifact into a
          # subdirectory named after the artifact, so the actual files end
          # up at rust-recorder-artifact/<artifact-name>/<files...>. We
          # find the OysterRecorder.exe to anchor the staging move.
          $rustExe = Get-ChildItem -Recurse rust-recorder-artifact `
                       -Filter 'OysterRecorder.exe' -File `
                       | Select-Object -First 1
          if (-not $rustExe) {
            Write-Error "rc16 invariant violated: OysterRecorder.exe not found in downloaded rust artifact"
            Write-Host "=== rust-recorder-artifact tree ==="
            Get-ChildItem -Recurse rust-recorder-artifact | Format-Table FullName, Length
            exit 1
          }
          # The artifact's root dir contains the binary + OBS runtime
          # (data/, obs-plugins/, obs-ffmpeg-mux.exe). Stage the whole
          # directory to bundle/recorder/ so the [Files] line in
          # installer.iss can do a recursive copy.
          $artifactRoot = Split-Path -Parent $rustExe.FullName
          New-Item -ItemType Directory -Force -Path 'bundle/recorder' | Out-Null
          Copy-Item -Path "$artifactRoot/*" -Destination 'bundle/recorder/' -Recurse -Force
          # Sanity check — same set the build-recorder-rust.yml verify step uses.
          $required = @(
            'bundle/recorder/OysterRecorder.exe',
            'bundle/recorder/obs-ffmpeg-mux.exe',
            'bundle/recorder/data',
            'bundle/recorder/obs-plugins'
          )
          foreach ($p in $required) {
            if (-not (Test-Path $p)) {
              Write-Error "rc16 invariant violated: $p missing after staging Rust artifact"
              Write-Host "=== bundle/recorder contents ==="
              Get-ChildItem bundle/recorder | Format-Table Name, Length
              exit 1
            }
          }
          $size_mb = [math]::Round((Get-ChildItem -Recurse bundle/recorder | Measure-Object -Property Length -Sum).Sum / 1MB, 1)
          Write-Host "Rust recorder staged at bundle/recorder/ (${size_mb} MB)"

      # ---------------------------------------------------------------------
      # 11c. rc19.0.2 — bundle standalone Python post-processing tooling
      # ---------------------------------------------------------------------
      # Howard's rc19.0.1 test (PRD lint 28/38) showed that 4 of 10 failures
      # were because the installer shipped ONLY the Rust recorder + JRE + MC
      # + mc-mod, and NOT the standalone Python finalize tools needed to
      # generate gameinfo.xlsx, depth/*.exr, audio_check.json, and
      # input_latency.json. The PyInstaller onedir bundle from step 11 has
      # these scripts INSIDE the EXE freeze, but they can't be invoked
      # post-record as standalone tools (no exposed CLI surface, dependencies
      # are bundled inside the PyInstaller sys.path).
      #
      # rc19.0.2 fix: ship the 4 finalize scripts + their helpers + the
      # Python deps they need + the DepthAnything V2 ONNX model as a SECOND
      # bundle at {app}/bin/, {app}/python-deps/, {app}/depth_models/,
      # callable via {app}/run_finalize.bat <session_dir>.
      #
      # Lint criteria unblocked by shipping these:
      #   #15  depth/*.exr present       — depth_exr_writer.py
      #   #16  depth/*.exr count >= 1800 — depth_exr_writer.py @6 fps
      #   #24  directory structure       — gameinfo.xlsx + depth/ created
      #   #39  input latency json        — measure_input_latency.py
      # plus #38 audio_check.json via audio_continuity_check.py.
      #
      # Out of scope for S01 (this step): auto-running finalize on game
      # process exit. That's S04's job. S01 only SHIPS the tools so they're
      # reachable from {app}\run_finalize.bat <session_dir> and any future
      # automation hook.
      - name: rc19.0.2 - Copy standalone Python finalize scripts to bundle/bin/
        shell: pwsh
        run: |
          # The four PRD finalize tools plus the helpers finalize_session.py
          # invokes via subprocess. We copy from bin/ in the SAME commit
          # we're building from (not a fresh clone of another repo) - the
          # oyster-agent-runner Python source lives in this repo's bin/.
          #
          # finalize_session.py invokes (as subprocess via sys.executable):
          #   - generate_gameinfo.py        (alias for generate_gameinfo_xlsx.py)
          #   - depth_exr_writer.py
          #   - audio_continuity_check.py
          # so all three helpers must be staged alongside the 4 PRD tools.
          New-Item -ItemType Directory -Force -Path 'bundle/bin' | Out-Null
          # Primary 4 PRD finalize entrypoints
          $primary = @(
            'finalize_session.py',
            'lint_v3_prd_grounded.py',
            'depth_exr_writer.py',
            'measure_input_latency.py'
          )
          # Helpers finalize_session.py shells out to
          $helpers = @(
            'audio_continuity_check.py'
          )
          foreach ($f in $primary + $helpers) {
            $src = "bin/$f"
            if (-not (Test-Path $src)) {
              Write-Error "rc19.0.2 invariant violated: $src missing from repo bin/"
              exit 1
            }
            Copy-Item $src -Destination "bundle/bin/$f" -Force
          }
          # finalize_session.py looks for `generate_gameinfo.py` (without
          # the _xlsx suffix) next to itself as a fallback. Ship the real
          # file under both names so the subprocess invocation resolves.
          Copy-Item 'bin/generate_gameinfo_xlsx.py' `
                    -Destination 'bundle/bin/generate_gameinfo.py' -Force
          Copy-Item 'bin/generate_gameinfo_xlsx.py' `
                    -Destination 'bundle/bin/generate_gameinfo_xlsx.py' -Force
          $count = (Get-ChildItem 'bundle/bin' -Filter '*.py').Count
          Write-Host "Staged $count Python scripts in bundle/bin/"
          Get-ChildItem 'bundle/bin' | Sort-Object Name | ForEach-Object {
            $kb = [math]::Round($_.Length / 1KB, 1)
            Write-Host "  ${kb} KB  $($_.Name)"
          }

      - name: rc19.0.2 - Pip install Python runtime deps to bundle/python-deps/
        shell: pwsh
        run: |
          # PEP 668 isolated install via --target. At runtime, run_finalize.bat
          # sets PYTHONPATH=python-deps; before invoking python.exe so the
          # scripts find their deps without polluting the user's site-packages.
          #
          # We pin opencv-python-headless (NOT opencv-python) - the headless
          # variant ships no GUI deps (no Qt, no GTK), so we save ~80 MB and
          # avoid the libGL.so.1 runtime issue that hits headless servers.
          # The Rust recorder owns the screen capture path; cv2 here only
          # decodes recording.mp4 frame-by-frame for depth inference.
          #
          # onnxruntime-directml gives AMD/Intel/NVIDIA iGPU acceleration on
          # Windows; on machines without DX12 the runtime falls back to CPU.
          # We do NOT install torch / torch-directml here - depth_exr_writer.py
          # uses pure ONNX Runtime, not PyTorch, for the V2-Small model.
          #
          # openpyxl is the preferred xlsx writer for gameinfo.xlsx; the
          # script has a stdlib zipfile+XML fallback but openpyxl is faster
          # and produces cleaner output. Ship the dep, take the fast path.
          #
          # mss = synthetic-input latency screen-capture for input_latency.json.
          New-Item -ItemType Directory -Force -Path 'bundle/python-deps' | Out-Null
          python -m pip install --target=bundle/python-deps --no-warn-script-location `
            "opencv-python-headless==4.10.0.84" `
            "onnxruntime-directml==1.20.1" `
            "openpyxl==3.1.5" `
            "OpenEXR==3.3.2" `
            "Imath==0.0.2" `
            "numpy==1.26.4" `
            "mss==9.0.2"
          # Sanity-import each one to verify the install resolved (catches the
          # case where a wheel pulled the wrong abi3 tag for Python 3.12 and
          # the install "succeeded" but the .pyd is unloadable).
          $env:PYTHONPATH = (Resolve-Path 'bundle/python-deps').Path
          python -c "import cv2, onnxruntime, openpyxl, OpenEXR, Imath, numpy, mss; print('python-deps OK:', cv2.__version__, onnxruntime.__version__, openpyxl.__version__, numpy.__version__)"
          $size_mb = [math]::Round((Get-ChildItem -Recurse bundle/python-deps | Measure-Object -Property Length -Sum).Sum / 1MB, 1)
          Write-Host "bundle/python-deps/ staged (${size_mb} MB)"

      - name: rc19.0.2 - Download DepthAnything V2 Small ONNX to bundle/depth_models/
        shell: pwsh
        run: |
          # depth_exr_writer.py's resolve_model_path() searches in order:
          #   1. --model-path CLI arg
          #   2. OYSTER_DEPTH_MODEL_PATH env var
          #   3. <install_root>/depth_models/depth_anything_v2_small.onnx
          #   4. %LOCALAPPDATA%/OysterRecorder/depth_models/
          # where _install_root() = Path(__file__).parent.parent. Since
          # finalize_session.py + depth_exr_writer.py will be installed to
          # {app}\bin\, install_root resolves to {app}, so the model must
          # land at {app}\depth_models\depth_anything_v2_small.onnx exactly.
          #
          # Source: onnx-community/Depth-Anything-V2-Small on HuggingFace,
          # file onnx/model.onnx (~99 MB, ViT-S backbone). This is the
          # canonical ONNX export referenced in depth_exr_writer.py
          # line 248. hf_hub_download handles LFS pointer redirection
          # automatically; direct curl would fetch the LFS pointer text
          # instead of the binary.
          New-Item -ItemType Directory -Force -Path 'bundle/depth_models' | Out-Null
          python -c "from huggingface_hub import hf_hub_download; p = hf_hub_download(repo_id='onnx-community/Depth-Anything-V2-Small', filename='onnx/model.onnx', revision='main', local_dir='hf_onnx_cache'); print('Downloaded to', p)"
          # hf_hub_download stages to hf_onnx_cache/onnx/model.onnx; copy to
          # the exact filename depth_exr_writer.py expects.
          $src = 'hf_onnx_cache/onnx/model.onnx'
          if (-not (Test-Path $src)) {
            Write-Error "DA-V2 ONNX model not downloaded - $src missing"
            exit 1
          }
          Copy-Item $src -Destination 'bundle/depth_models/depth_anything_v2_small.onnx' -Force
          $size_mb = [math]::Round((Get-Item 'bundle/depth_models/depth_anything_v2_small.onnx').Length / 1MB, 1)
          if ($size_mb -lt 50) {
            Write-Error "DA-V2 ONNX model too small (${size_mb} MB < 50 MB) - likely an LFS pointer not the real weights"
            exit 1
          }
          Write-Host "bundle/depth_models/depth_anything_v2_small.onnx staged (${size_mb} MB)"

      - name: rc19.0.2 - Generate bundle/run_finalize.bat wrapper
        shell: pwsh
        run: |
          # User-facing entry point. After install, a session can be
          # post-processed by either:
          #   1. Running `%LOCALAPPDATA%\GameData Recorder\run_finalize.bat
          #      <session_dir>` interactively, OR
          #   2. Being invoked programmatically by S04's auto-run hook
          #      (game-process-exit) - same args, same surface.
          #
          # We deliberately do NOT bundle a Python interpreter - the user is
          # expected to have system Python 3.11+ on PATH. If it's missing,
          # the .bat exits with a clear pip-style error. Bundling embedded
          # Python adds ~30 MB and a maintenance burden; minipc1 already has
          # 3.11 and the next-gen consumer rigs will too.
          #
          # PYTHONPATH is set to {app}\python-deps so the staged wheels are
          # importable without polluting site-packages. SET (not SETX) keeps
          # the env var scoped to the .bat session.
          #
          # NOTE: we do NOT use a PowerShell @'...'@ here-string because
          # YAML's block-scalar indentation collides with here-string's
          # requirement that the closing '@ marker sits at column 0 — those
          # two constraints can't both be satisfied. Instead we build the
          # batch content as a PowerShell string array and join with CRLF,
          # which is column-independent and reads cleanly under `run: |`.
          $batLines = @(
            '@echo off',
            'setlocal enableextensions',
            'rem -------------------------------------------------------------------------',
            'rem run_finalize.bat - rc19.0.2 PRD finalize entrypoint',
            'rem',
            'rem Usage:',
            'rem   run_finalize.bat <session_dir>',
            'rem   run_finalize.bat "C:\path\with spaces\session_2026-05-13"',
            'rem',
            'rem Effect (per bin\finalize_session.py):',
            'rem   - syncs game_state.jsonl from ~/Documents/OysterClips/active_session/',
            'rem   - backfills action_camera.json with quaternion + position + offset',
            'rem   - generates gameinfo.xlsx       (PRD #24, openpyxl)',
            'rem   - generates depth\*.exr         (PRD #15/#16, DA-V2 Small ONNX)',
            'rem   - generates audio_check.json    (PRD #38)',
            'rem',
            'rem Exit codes:',
            'rem   0  finalize succeeded; all PRD section 3 deliverables present',
            'rem   1  finalize partial; some step failed (check stderr)',
            'rem   2  no session_dir argument given',
            'rem   3  python.exe not found on PATH',
            'rem -------------------------------------------------------------------------',
            '',
            'if "%~1"=="" (',
            '  echo Usage: run_finalize.bat ^<session_dir^>',
            '  exit /b 2',
            ')',
            '',
            'rem Locate ourselves so paths are absolute regardless of caller cwd.',
            'set "APP_ROOT=%~dp0"',
            'if "%APP_ROOT:~-1%"=="\" set "APP_ROOT=%APP_ROOT:~0,-1%"',
            '',
            'set "PYTHONPATH=%APP_ROOT%\python-deps"',
            'set "OYSTER_DEPTH_MODEL_PATH=%APP_ROOT%\depth_models\depth_anything_v2_small.onnx"',
            '',
            'where python.exe >nul 2>&1',
            'if errorlevel 1 (',
            '  echo ERROR: python.exe not found on PATH. Install Python 3.11+ from python.org and re-run.',
            '  exit /b 3',
            ')',
            '',
            'rem finalize_session.py CLI: <session_dir> (positional) + --verbose + --repo-root.',
            'rem --repo-root tells the script where to look for vendor/recorder/scripts/;',
            'rem we pass APP_ROOT so the fallback "alongside this script" path resolves',
            'rem to {app}\bin\generate_gameinfo.py (the alias we shipped).',
            'python.exe "%APP_ROOT%\bin\finalize_session.py" "%~1" --verbose --repo-root "%APP_ROOT%"',
            'exit /b %ERRORLEVEL%'
          )
          # Inno Setup [Files] preserves whatever line endings the source
          # file has - write CRLF so cmd.exe is happy on machines without
          # autocrlf conversion in their git config.
          $bat = ($batLines -join "`r`n") + "`r`n"
          [System.IO.File]::WriteAllText(
            (Join-Path (Get-Location) 'bundle/run_finalize.bat'),
            $bat,
            [System.Text.Encoding]::ASCII
          )
          if (-not (Test-Path 'bundle/run_finalize.bat')) {
            Write-Error "Failed to write bundle/run_finalize.bat"
            exit 1
          }
          $bytes = (Get-Item 'bundle/run_finalize.bat').Length
          Write-Host "bundle/run_finalize.bat written (${bytes} bytes)"
          Get-Content 'bundle/run_finalize.bat' -TotalCount 5

      # ---------------------------------------------------------------------
      # 12. Stage the full bundle layout that installer.iss expects
      # ---------------------------------------------------------------------
      # The exact paths come from bin/build_bundled_installer/installer.iss
      # `[Files]` block (kept in sync deliberately):
      #   Source: "{#BundleRoot}\jre\*"                  -> bundle/jre/...
      #   Source: "{#BundleRoot}\mc-instance\*"          -> bundle/mc-instance/...
      #   Source: "{#BundleRoot}\OysterRecorder-onedir\*"-> bundle/OysterRecorder-onedir/  (Python FALLBACK)
      #   Source: "{#BundleRoot}\recorder\*"             -> bundle/recorder/                (Rust PRIMARY, rc16)
      #   Source: "{#BundleRoot}\OysterPlay.exe"         -> bundle/OysterPlay.exe
      #   Source: "{#BundleRoot}\manifest.json"          -> bundle/manifest.json
      #   Source: "{#BundleRoot}\bin\*"                  -> bundle/bin/                    (rc19.0.2)
      #   Source: "{#BundleRoot}\python-deps\*"          -> bundle/python-deps/            (rc19.0.2)
      #   Source: "{#BundleRoot}\depth_models\*"         -> bundle/depth_models/           (rc19.0.2)
      #   Source: "{#BundleRoot}\run_finalize.bat"       -> bundle/run_finalize.bat        (rc19.0.2)
      - name: Compose bundle/ layout
        shell: pwsh
        run: |
          # OysterPlay.exe lives at the top of the bundle (NOT under
          # bundle/launcher/) — installer.iss references it by that exact path.
          Copy-Item 'dist/OysterPlay.exe' -Destination 'bundle/OysterPlay.exe' -Force
          # Sanity: every file installer.iss will reference must exist.
          # rc16: bundle/recorder/OysterRecorder.exe (Rust PRIMARY) is now
          # required alongside the Python FALLBACK onedir.
          $required = @(
            'bundle/jre/bin/javaw.exe',
            'bundle/mc-instance/versions/1.21.4/1.21.4.jar',
            'bundle/mc-instance/versions/fabric-loader-0.16.10-1.21.4/fabric-loader-0.16.10-1.21.4.json',
            'bundle/mc-instance/mods',
            'bundle/OysterPlay.exe',
            'bundle/OysterRecorder-onedir/OysterRecorder-onedir.exe',
            'bundle/recorder/OysterRecorder.exe',
            'bundle/recorder/obs-ffmpeg-mux.exe',
            # rc19.0.2 - standalone Python finalize tooling
            'bundle/bin/finalize_session.py',
            'bundle/bin/lint_v3_prd_grounded.py',
            'bundle/bin/depth_exr_writer.py',
            'bundle/bin/measure_input_latency.py',
            'bundle/bin/audio_continuity_check.py',
            'bundle/bin/generate_gameinfo.py',
            'bundle/python-deps',
            'bundle/depth_models/depth_anything_v2_small.onnx',
            'bundle/run_finalize.bat'
          )
          foreach ($p in $required) {
            if (-not (Test-Path $p)) {
              Write-Error "Bundle layout invariant violated: $p missing"
              exit 1
            }
          }
          $size_mb = [math]::Round((Get-ChildItem -Recurse bundle | Measure-Object -Property Length -Sum).Sum / 1MB, 1)
          Write-Host "Bundle staged. Total size: ${size_mb} MB"

      # ---------------------------------------------------------------------
      # 13. Compose bundle/manifest.json — SHA-256 of every top-level artifact
      # ---------------------------------------------------------------------
      # Inline pwsh because we don't want to add another Python script to
      # the spec set just for hashing. Every file inside bundle/ gets a
      # SHA-256 — directories are summarized by their flat-file SHA list,
      # not one-shot tar-and-hash, because Inno Setup unpacks individual
      # files.
      - name: Compose bundle/manifest.json (SHA-256 every file)
        shell: pwsh
        run: |
          $entries = @()
          Get-ChildItem -Recurse -File bundle | ForEach-Object {
            $rel = (Resolve-Path $_.FullName -Relative) -replace '^\.\\', '' -replace '\\', '/'
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            $entries += [pscustomobject]@{
              path = $rel
              size_bytes = $_.Length
              sha256 = $hash
            }
          }
          $manifest = [pscustomobject]@{
            schema_version = 1
            produced_by = '.github/workflows/build-recorder-installer.yml'
            release_tag = $env:RELEASE_TAG
            app_version = $env:APP_VERSION
            commit_sha = $env:GITHUB_SHA
            file_count = $entries.Count
            files = $entries
          }
          $manifestPath = 'bundle/manifest.json'
          $manifest | ConvertTo-Json -Depth 6 | Out-File -Encoding utf8 $manifestPath
          Write-Host "Wrote $manifestPath with $($entries.Count) entries"

      # ---------------------------------------------------------------------
      # 13b. rc19.0.2.1 — Pre-Inno-Setup verify bundle contents
      # ---------------------------------------------------------------------
      # Belt-and-braces gate that mirrors every [Files] block in
      # bin/build_bundled_installer/installer.iss. If ANY of these is
      # missing at this point, Inno Setup may silently skip it (an empty
      # source-glob produces zero [Files] entries with no compile error)
      # and we'd ship an incomplete installer. The earlier "Compose
      # bundle/ layout" step already checks most of these — this step
      # is intentionally redundant so any future addition to installer.iss
      # gets a corresponding entry HERE, keeping the .iss + workflow in
      # lockstep. Fail loud, fail early.
      #
      # rc19.0.2 shipped without `bundle/python-deps/` and `bundle/run_finalize.bat`
      # making it into the install root on minipc1, even though the
      # workflow's bundle staging steps logged success. Two defensive
      # additions in this PR: this PRE-compile audit, and a POST-compile
      # innoextract sweep (see 14b below) that confirms the .exe actually
      # contains the files we expect.
      - name: rc19.0.2.1 - Pre-Inno-Setup verify bundle contents
        shell: pwsh
        run: |
          # Each entry maps 1:1 to a Source: line in installer.iss [Files].
          # Directories use Test-Path AND a non-empty content check —
          # Inno's `Source: "...\\*"` flag silently expands to nothing on
          # an empty source dir, which is the EXACT failure mode of
          # rc19.0.2's python-deps drop.
          $requiredFiles = @(
            'bundle/jre/bin/javaw.exe',
            'bundle/mc-instance/versions/1.21.4/1.21.4.jar',
            'bundle/mc-instance/versions/fabric-loader-0.16.10-1.21.4/fabric-loader-0.16.10-1.21.4.json',
            'bundle/mc-instance/mods/fabric-api.jar',
            'bundle/OysterRecorder-onedir/OysterRecorder-onedir.exe',
            'bundle/recorder/OysterRecorder.exe',
            'bundle/recorder/obs-ffmpeg-mux.exe',
            'bundle/OysterPlay.exe',
            'bundle/manifest.json',
            # rc19.0.2 — standalone Python finalize tooling (S01)
            'bundle/bin/finalize_session.py',
            'bundle/bin/lint_v3_prd_grounded.py',
            'bundle/bin/depth_exr_writer.py',
            'bundle/bin/measure_input_latency.py',
            'bundle/bin/audio_continuity_check.py',
            'bundle/bin/generate_gameinfo.py',
            'bundle/bin/generate_gameinfo_xlsx.py',
            'bundle/depth_models/depth_anything_v2_small.onnx',
            'bundle/run_finalize.bat'
          )
          $requiredDirs = @(
            # Each dir MUST contain at least one file; Inno's recursesubdirs
            # glob silently no-ops on empty trees.
            @{ path = 'bundle/python-deps'; minFiles = 100 },  # ~5996 in practice
            @{ path = 'bundle/python-deps/numpy'; minFiles = 5 },
            @{ path = 'bundle/python-deps/cv2'; minFiles = 1 },
            @{ path = 'bundle/python-deps/onnxruntime'; minFiles = 1 },
            @{ path = 'bundle/python-deps/openpyxl'; minFiles = 1 },
            @{ path = 'bundle/mc-instance/mods'; minFiles = 9 },  # 9 MC versions + fabric-api
            @{ path = 'bundle/depth_models'; minFiles = 1 },
            @{ path = 'bundle/bin'; minFiles = 7 },
            @{ path = 'bundle/jre'; minFiles = 50 }
          )
          $missing = New-Object 'System.Collections.Generic.List[string]'
          foreach ($p in $requiredFiles) {
            if (-not (Test-Path $p -PathType Leaf)) {
              $missing.Add("FILE MISSING: $p")
            } else {
              Write-Host "OK: $p"
            }
          }
          foreach ($d in $requiredDirs) {
            if (-not (Test-Path $d.path -PathType Container)) {
              $missing.Add("DIR MISSING: $($d.path)")
              continue
            }
            $count = (Get-ChildItem -Recurse -File $d.path -ErrorAction SilentlyContinue).Count
            if ($count -lt $d.minFiles) {
              $missing.Add("DIR TOO SMALL: $($d.path) has $count files, expected >= $($d.minFiles)")
            } else {
              Write-Host "OK: $($d.path) ($count files)"
            }
          }
          if ($missing.Count -gt 0) {
            Write-Host ""
            Write-Host "=== PRE-INNO-SETUP VERIFY FAILED ===" -ForegroundColor Red
            foreach ($m in $missing) { Write-Error $m }
            Write-Host ""
            Write-Host "=== bundle/ tree at failure ==="
            if (Test-Path bundle) {
              Get-ChildItem -Recurse bundle -Depth 2 -ErrorAction SilentlyContinue `
                | Select-Object -First 60 `
                | ForEach-Object { Write-Host "  $($_.FullName)" }
            } else {
              Write-Host "  (bundle/ directory does not exist)"
            }
            exit 1
          }
          Write-Host ""
          Write-Host "Pre-Inno-Setup verify PASSED: bundle/ has every input declared in installer.iss [Files]"

      # ---------------------------------------------------------------------
      # 14. R05D — Inno Setup compile installer.iss
      # ---------------------------------------------------------------------
      # installer.iss declares:
      #   OutputDir=..\\..\\dist\\installer
      #   OutputBaseFilename=GameDataRecorder-Setup-v{#AppVersion}
      # so passing /DAppVersion=$APP_VERSION (e.g. 1.2.3) yields:
      #   dist/installer/GameDataRecorder-Setup-v1.2.3.exe
      # We copy that into dist/ with a release-tag-prefixed name (e.g.
      # GameDataRecorder-Setup-recorder-v1.2.3.exe) for the upload step,
      # since the Release page's filename should match the tag exactly.
      - name: R05D — Inno Setup compile installer
        shell: pwsh
        run: |
          $iss = 'bin/build_bundled_installer/installer.iss'
          if (-not (Test-Path $iss)) {
            Write-Error "R05D artifact missing: $iss (check spec R05D_inno_setup_installer.md)"
            exit 1
          }
          # /Qp = quiet w/ progress (no /SILENT), /D injects preprocessor symbol.
          iscc.exe /Qp "/DAppVersion=$env:APP_VERSION" $iss
          if ($LASTEXITCODE -ne 0) {
            Write-Error "iscc.exe exited $LASTEXITCODE — installer compile failed"
            exit 1
          }
          # installer.iss's OutputDir is "..\\..\\dist\\installer" (relative
          # to the .iss file); resolved to repo-root that's dist/installer/.
          $issOut = "dist/installer/GameDataRecorder-Setup-v$env:APP_VERSION.exe"
          if (-not (Test-Path $issOut)) {
            Write-Error "Inno Setup output not found at $issOut"
            Get-ChildItem -Recurse -Filter 'GameDataRecorder-Setup-*.exe' `
              | ForEach-Object { Write-Host "  found candidate: $($_.FullName)" }
            exit 1
          }
          # Final upload filename is keyed on the RELEASE_TAG (e.g.
          # `recorder-v1.2.3`), not the bare semver, so the Release page
          # asset name and the tag are 1:1.
          $finalExe = "dist/GameDataRecorder-Setup-$env:RELEASE_TAG.exe"
          Copy-Item -Force $issOut $finalExe
          $size_mb = [math]::Round((Get-Item $finalExe).Length / 1MB, 1)
          Write-Host "Installer built: $finalExe (${size_mb} MB)"
          # Iron-law size sanity gate (mirrors build_all.ps1 stage 8).
          $bytes = (Get-Item $finalExe).Length
          if ($bytes -lt (400 * 1MB)) {
            Write-Error "Installer is too small (${size_mb} MiB < 400 MiB) — JRE / MC bundle may be missing"
            exit 1
          }
          if ($bytes -gt (1300 * 1MB)) {
            # rc7 target was ~800 MB (rc6 was ~460 MB before bundling MC
            # asset objects). rc19.0.2 raises ceiling to 1300 MB to absorb
            # the new standalone Python finalize tooling bundle:
            #   * bundle/bin/         ~ 200 KB  (6 .py scripts)
            #   * bundle/python-deps/ ~150 MB   (cv2, onnxruntime-directml,
            #                                    openpyxl, OpenEXR, numpy,
            #                                    mss + transitive deps)
            #   * bundle/depth_models ~ 99 MB   (DA-V2 Small ONNX)
            #   * run_finalize.bat    ~  2 KB
            # Total added: ~250 MB pre-compression. Solid LZMA2 typically
            # compresses Python wheels ~50% and the ONNX model ~30%, so the
            # installer .exe should grow by ~130-150 MB net (rc19.0.1 was
            # ~860 MB so rc19.0.2 target is ~1.0-1.05 GB). Mirrors
            # build_all.ps1's gate - keep both in sync when re-tuning.
            Write-Error "Installer is too large (${size_mb} MiB > 1300 MiB) - investigate Solid compression"
            exit 1
          }

      # ---------------------------------------------------------------------
      # 14b. rc19.0.2.1 — Post-Inno-Setup verify installer contents
      # ---------------------------------------------------------------------
      # Even with installer.iss [Files] correctly declared AND the pre-compile
      # verify confirming bundle/ has every input, there's a thin wedge where
      # Inno Setup could silently drop a file: a `Source: dir\\*` with the
      # `recursesubdirs` flag is interpreted PER-RUN by ISCC, and bug reports
      # from past Inno Setup versions show edge cases where a subdir with
      # specific path lengths or special characters gets skipped. We close
      # that wedge by unpacking the compiled .exe with innoextract and
      # asserting every file we EXPECTED to ship is actually IN the
      # installer image.
      #
      # We verify by RUNNING the installer silently into a throwaway dir.
      # The installer is self-extracting, so this is the only
      # format-version-proof method — and it's exactly the path the end
      # user runs, so we test real deployment.
      #
      # rc19.0.2.2: replaced innoextract. innoextract is a third-party
      # reverse-engineering tool that LAGS behind official Inno Setup
      # releases — on rc19.0.2.1 it failed with "Unexpected setup loader
      # revision: 2 / Could not determine setup data version" against a
      # perfectly valid installer (false negative, blocked the release).
      # `Setup.exe /VERYSILENT` is documented + stable across all Inno
      # Setup 5.x/6.x versions.
      - name: rc19.0.2.2 - Post-Inno-Setup verify installer contains all expected files
        shell: pwsh
        run: |
          $installer = "dist/GameDataRecorder-Setup-$env:RELEASE_TAG.exe"
          if (-not (Test-Path $installer)) {
            Write-Error "Installer not found at $installer"
            exit 1
          }
          # Run the installer silently into a throwaway dir.
          #   /VERYSILENT        — no UI at all
          #   /SUPPRESSMSGBOXES  — auto-answer any prompts
          #   /DIR=...           — target install dir
          #   /LOG=...           — capture install log for diagnostics
          #   /NOICONS           — skip Start Menu / desktop shortcuts in CI
          $unpackedAppRoot = Join-Path $env:RUNNER_TEMP 'verify-install'
          $installLog = Join-Path $env:RUNNER_TEMP 'verify-install.log'
          if (Test-Path $unpackedAppRoot) {
            Remove-Item -Recurse -Force $unpackedAppRoot
          }
          New-Item -ItemType Directory -Force -Path $unpackedAppRoot | Out-Null
          Write-Host "Running $installer /VERYSILENT into $unpackedAppRoot ..."
          $proc = Start-Process -FilePath $installer `
            -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/DIR=$unpackedAppRoot","/LOG=$installLog","/NOICONS" `
            -Wait -PassThru
          if ($proc.ExitCode -ne 0) {
            Write-Error "Installer exited with code $($proc.ExitCode)"
            if (Test-Path $installLog) {
              Write-Host "=== install log (tail 40) ==="
              Get-Content $installLog -Tail 40
            }
            exit 1
          }
          if (-not (Test-Path $unpackedAppRoot -PathType Container)) {
            Write-Error "Install dir $unpackedAppRoot does not exist after /VERYSILENT install"
            exit 1
          }
          # rc19.0.2.1: the EXACT regression we shipped — python-deps,
          # depth_models, run_finalize.bat — gets a dedicated post-compile
          # assertion. Each entry is a file/dir that MUST exist under
          # <unpackedAppRoot>/<relpath>; for dirs we also assert min file count.
          $required = @(
            @{ kind = 'file'; path = 'jre/bin/javaw.exe' },
            @{ kind = 'file'; path = 'mc-instance/versions/1.21.4/1.21.4.jar' },
            @{ kind = 'file'; path = 'mc-instance/versions/fabric-loader-0.16.10-1.21.4/fabric-loader-0.16.10-1.21.4.json' },
            @{ kind = 'file'; path = 'mc-instance/mods/fabric-api.jar' },
            @{ kind = 'file'; path = 'OysterPlay.exe' },
            @{ kind = 'file'; path = 'manifest.json' },
            @{ kind = 'file'; path = 'recorder/OysterRecorder.exe' },
            @{ kind = 'file'; path = 'recorder/obs-ffmpeg-mux.exe' },
            # rc19.0.2 S01 — standalone Python finalize tooling
            @{ kind = 'file'; path = 'bin/finalize_session.py' },
            @{ kind = 'file'; path = 'bin/lint_v3_prd_grounded.py' },
            @{ kind = 'file'; path = 'bin/depth_exr_writer.py' },
            @{ kind = 'file'; path = 'bin/measure_input_latency.py' },
            @{ kind = 'file'; path = 'bin/audio_continuity_check.py' },
            @{ kind = 'file'; path = 'bin/generate_gameinfo.py' },
            @{ kind = 'file'; path = 'bin/generate_gameinfo_xlsx.py' },
            @{ kind = 'file'; path = 'depth_models/depth_anything_v2_small.onnx' },
            @{ kind = 'file'; path = 'run_finalize.bat' },
            @{ kind = 'dir';  path = 'python-deps'; minFiles = 100 },
            @{ kind = 'dir';  path = 'python-deps/numpy'; minFiles = 5 },
            @{ kind = 'dir';  path = 'python-deps/cv2'; minFiles = 1 },
            @{ kind = 'dir';  path = 'python-deps/onnxruntime'; minFiles = 1 },
            @{ kind = 'dir';  path = 'python-deps/openpyxl'; minFiles = 1 },
            @{ kind = 'dir';  path = 'depth_models'; minFiles = 1 },
            @{ kind = 'dir';  path = 'bin'; minFiles = 7 },
            @{ kind = 'dir';  path = 'jre'; minFiles = 50 }
          )
          $missing = New-Object 'System.Collections.Generic.List[string]'
          foreach ($r in $required) {
            $full = Join-Path $unpackedAppRoot $r.path
            if ($r.kind -eq 'file') {
              if (-not (Test-Path $full -PathType Leaf)) {
                $missing.Add("FILE MISSING IN INSTALLER: $($r.path)")
              } else {
                $kb = [math]::Round((Get-Item $full).Length / 1KB, 1)
                Write-Host "OK: $($r.path) (${kb} KB)"
              }
            } else {  # dir
              if (-not (Test-Path $full -PathType Container)) {
                $missing.Add("DIR MISSING IN INSTALLER: $($r.path)")
                continue
              }
              $cnt = (Get-ChildItem -Recurse -File $full -ErrorAction SilentlyContinue).Count
              if ($cnt -lt $r.minFiles) {
                $missing.Add("DIR TOO SMALL IN INSTALLER: $($r.path) has $cnt files, expected >= $($r.minFiles)")
              } else {
                Write-Host "OK: $($r.path)/ ($cnt files)"
              }
            }
          }
          if ($missing.Count -gt 0) {
            Write-Host ""
            Write-Host "=== POST-INNO-SETUP VERIFY FAILED ===" -ForegroundColor Red
            Write-Host "rc19.0.2 shipped with EXACTLY this kind of silent omission."
            Write-Host "If you see this, the installer .exe is INCOMPLETE — DO NOT release."
            Write-Host ""
            foreach ($m in $missing) { Write-Error $m }
            Write-Host ""
            Write-Host "=== unpacked installer tree (top 80) ==="
            Get-ChildItem -Recurse $unpackedAppRoot -Depth 2 -ErrorAction SilentlyContinue `
              | Select-Object -First 80 `
              | ForEach-Object { Write-Host "  $($_.FullName.Substring($unpackedAppRoot.Length))" }
            exit 1
          }
          $totalFiles = (Get-ChildItem -Recurse -File $unpackedAppRoot).Count
          Write-Host ""
          Write-Host "Post-Inno-Setup verify PASSED: installer self-extracts $totalFiles files, all expected paths present."
          # Reclaim the ~3 GB the install tree consumed so the runner has
          # disk for the SHA / upload steps.
          Remove-Item -Recurse -Force $unpackedAppRoot

      # ---------------------------------------------------------------------
      # 15. SHA-256 the final installer + emit SHA-256-manifest.txt
      # ---------------------------------------------------------------------
      - name: SHA-256 installer + write SHA-256-manifest.txt
        shell: pwsh
        run: |
          $installer = "dist/GameDataRecorder-Setup-$env:RELEASE_TAG.exe"
          $instHash = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLower()
          # release-extras/*.jar (the 9 advanced-user mod jars) get hashed
          # too, so power users can verify any individual download.
          $generatedAt = (Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ')
          $lines = @(
            "# OysterRecorder $env:RELEASE_TAG — SHA-256 manifest"
            "# Generated $generatedAt by build-recorder-installer.yml"
            "# Commit: $env:GITHUB_SHA"
            ""
            "$instHash  $(Split-Path -Leaf $installer)"
          )
          Get-ChildItem release-extras -Filter '*.jar' | Sort-Object Name | ForEach-Object {
            $h = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            $lines += "$h  $($_.Name)"
          }
          $manifestPath = 'dist/SHA-256-manifest.txt'
          $lines | Out-File -Encoding ascii $manifestPath
          Write-Host "Wrote $manifestPath"
          Get-Content $manifestPath | Select-Object -First 20 | ForEach-Object { Write-Host "  $_" }

      # ---------------------------------------------------------------------
      # 16. Generate release_notes.md from git log between previous tag and HEAD
      # ---------------------------------------------------------------------
      # IRON LAW: never include build credentials in notes. We only call
      # `git log` and `git tag` — no env, no secrets are echoed in.
      - name: Generate release_notes.md from commit log
        if: env.IS_RELEASE == 'true'
        shell: bash
        run: |
          set -euo pipefail
          # Find the most recent recorder-v* tag BEFORE the current one.
          prev_tag=$(git tag --list 'recorder-v*' --sort=-v:refname \
                     | grep -v "^${RELEASE_TAG}$" | head -n1 || true)
          {
            echo "# Oyster Recorder ${RELEASE_TAG}"
            echo
            echo "Single-file Windows installer with bundled JRE + Minecraft 1.21.4 + Fabric loader + Oyster recording mod. Double-click \`GameDataRecorder-Setup-${RELEASE_TAG}.exe\` to install (no admin required, installs to \`%LOCALAPPDATA%\\OysterRecorder\\\`)."
            echo
            echo "## What's in this release"
            echo
            echo "- **\`GameDataRecorder-Setup-${RELEASE_TAG}.exe\`** — main bundled installer (recommended download)"
            echo "- **\`SHA-256-manifest.txt\`** — verification hashes for every release artifact"
            echo "- **9 mod jars** — \`oyster-recorder-mod-*-mc<MC_VERSION>.jar\` for advanced users running their own MC outside the bundled instance"
            echo
            echo "## Changes since ${prev_tag:-initial release}"
            echo
            if [ -n "${prev_tag}" ]; then
              git log --pretty=format:'- %s (%h)' "${prev_tag}..HEAD" \
                | grep -v -E '^\- (chore|ci): ' \
                || echo "- No user-facing commits between ${prev_tag} and ${RELEASE_TAG}"
            else
              echo "- Initial bundled installer release."
            fi
            echo
            echo
            echo "## Verifying your download"
            echo
            echo "All artifacts are SHA-256 pinned. Compare your local hash against \`SHA-256-manifest.txt\`:"
            echo
            echo '```powershell'
            echo "Get-FileHash GameDataRecorder-Setup-${RELEASE_TAG}.exe -Algorithm SHA256"
            echo '```'
          } > release_notes.md
          echo "--- release_notes.md preview ---"
          head -40 release_notes.md

      # ---------------------------------------------------------------------
      # 17. Upload everything to the GitHub Release (tag-push only)
      # ---------------------------------------------------------------------
      # `gh release create` is idempotent only via `--clobber` on upload,
      # NOT on create itself. So we split: create-if-not-exists, then upload
      # with --clobber so re-runs of the same tag don't conflict.
      - name: Create / update GitHub Release (tag-push only)
        if: env.IS_RELEASE == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --title "Recorder $RELEASE_TAG" \
              --notes-file release_notes.md
          else
            echo "Release $RELEASE_TAG already exists — re-uploading assets only."
          fi

      - name: Upload installer + SHA manifest + 9 mod jars
        if: env.IS_RELEASE == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # The ONLY user-facing assets per spec R05E:
          #   * the bundled installer .exe
          #   * the SHA-256 manifest
          #   * the 9 standalone mod jars (advanced users)
          # Notably absent: JRE zip, MC client.jar, Fabric profile JSON,
          # OysterPlay.exe, OysterRecorder-onedir, bundle/manifest.json.
          # rc17.0.2: split per-file with timeout + retry to fix flaky
          # `gh release upload` hangs on large Windows runner uploads.
          # Root cause: gh CLI has no inherent retry, single 900MB upload
          # can stall mid-stream and hang for 16+ min with zero progress.
          # Fix: split, set per-attempt timeout, retry 5x on installer.

          INSTALLER="dist/GameDataRecorder-Setup-${RELEASE_TAG}.exe"
          echo "Installer size: $(stat -c %s "$INSTALLER" 2>/dev/null || stat -f %z "$INSTALLER") bytes"

          # 1) Installer (large, retry up to 5x with 8min timeout each)
          for attempt in 1 2 3 4 5; do
            echo "=== Installer upload attempt $attempt/5 ==="
            if timeout 480s gh release upload "$RELEASE_TAG" "$INSTALLER" --clobber; then
              echo "✓ Installer uploaded on attempt $attempt"
              break
            fi
            if [ $attempt -eq 5 ]; then
              echo "✗ Installer upload exhausted retries"
              exit 1
            fi
            echo "Installer upload attempt $attempt failed, retry in 20s..."
            sleep 20
          done

          # 2) SHA manifest (tiny, short timeout)
          for attempt in 1 2 3; do
            if timeout 60s gh release upload "$RELEASE_TAG" "dist/SHA-256-manifest.txt" --clobber; then
              echo "✓ SHA manifest uploaded on attempt $attempt"
              break
            fi
            [ $attempt -eq 3 ] && { echo "✗ SHA manifest failed"; exit 1; }
            sleep 5
          done

          # 3) Mod jars batch (9 × 15KB)
          for attempt in 1 2 3; do
            if timeout 120s gh release upload "$RELEASE_TAG" release-extras/oyster-recorder-mod-*.jar --clobber; then
              echo "✓ Mod jars uploaded on attempt $attempt"
              break
            fi
            [ $attempt -eq 3 ] && { echo "✗ Mod jars failed"; exit 1; }
            sleep 5
          done

      # ---------------------------------------------------------------------
      # 18. Always upload the artifacts to the workflow run for inspection
      # ---------------------------------------------------------------------
      # Including on workflow_dispatch (smoke) — that's the whole point of
      # the smoke mode: verify the pipeline produced the right artifacts
      # without cutting a Release.
      - name: Upload workflow artifacts (smoke + full)
        uses: actions/upload-artifact@v4
        with:
          name: OysterRecorder-bundled-${{ env.RELEASE_TAG }}
          path: |
            dist/GameDataRecorder-Setup-*.exe
            dist/SHA-256-manifest.txt
            release-extras/*.jar
            bundle/manifest.json
          if-no-files-found: error
          retention-days: 30
