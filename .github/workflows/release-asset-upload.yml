---
name: Release Asset Upload (S90)

# S90 · Auto-attach OysterRecorder-setup-vX.Y.Z.exe to GitHub Release
# ====================================================================
# Trigger semantics
# -----------------
#   1. `workflow_run` — fires when the S60 build workflow (build-recorder-installer.yml)
#      completes successfully. Downloads the built installer artifact and uploads it
#      to the GitHub Release matching the triggering tag.
#   2. `push` of tags matching `recorder-v*` — direct tag push path for manual /
#      ad-hoc releases.
#
# Steps
# -----
#   1. Checkout repo
#   2. Download the installer artifact from the S60 workflow run
#   3. Upload OysterRecorder-setup-*.exe to the matching GitHub Release
#   4. Generate SHA256SUMS.txt and upload it as well
#
# Permissions
# -----------
#   `contents: write` — required for `gh release upload`

on:
  workflow_run:
    workflows:
      - "Build Recorder Bundled Installer (R05E)"
    types:
      - completed
  push:
    tags:
      - "recorder-v*"

permissions:
  contents: write

jobs:
  upload-release-asset:
    runs-on: ubuntu-latest
    if: >-
      (github.event_name == 'push') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    steps:
      # -------------------------------------------------------------------
      # 1. Determine the release tag
      # -------------------------------------------------------------------
      - name: Resolve release tag
        id: tag
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            # push of a tag — strip refs/tags/ prefix
            TAG="${GITHUB_REF#refs/tags/}"
          else
            # workflow_run — extract tag from the triggering workflow_run
            # The S60 workflow sets RELEASE_TAG as an output; we read it
            # from the workflow_run event payload.
            TAG="${{ github.event.workflow_run.head_branch }}"
            # head_branch for a tag push is the tag name itself
            if [ -z "$TAG" ]; then
              echo "ERROR: cannot determine release tag from workflow_run event" >&2
              exit 1
            fi
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Resolved release tag: ${TAG}"

      # -------------------------------------------------------------------
      # 2. Checkout
      # -------------------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # -------------------------------------------------------------------
      # 3. Download artifact from S60 workflow run (only for workflow_run trigger)
      # -------------------------------------------------------------------
      - name: Download installer artifact from S60 build
        if: github.event_name == 'workflow_run'
        uses: dawidd6/action-download-artifact@v6
        with:
          run_id: ${{ github.event.workflow_run.id }}
          name: oyster-recorder-installer
          path: dist/
          if_no_artifact_found: fail

      # -------------------------------------------------------------------
      # 3b. For tag-push trigger, the artifact should already be in the repo
      #     or we skip download (assumes the S60 workflow already uploaded).
      # -------------------------------------------------------------------
      - name: Verify installer artifact exists
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(dist/OysterRecorder-setup-*.exe dist/OysterRecorder-Setup-*.exe)
          if [ ${#files[@]} -eq 0 ]; then
            echo "ERROR: No OysterRecorder-setup-*.exe found in dist/" >&2
            exit 1
          fi
          echo "Found installer: ${files[0]}"

      # -------------------------------------------------------------------
      # 4. Upload to GitHub Release
      # -------------------------------------------------------------------
      - name: Upload installer to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          bash scripts/upload_release_asset.sh "${RELEASE_TAG}" dist/

      # -------------------------------------------------------------------
      # 5. Generate and upload SHA256SUMS.txt
      # -------------------------------------------------------------------
      - name: Generate and upload SHA256SUMS.txt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          cd dist/
          sha256sum OysterRecorder-setup-*.exe OysterRecorder-Setup-*.exe 2>/dev/null \
            | sort > SHA256SUMS.txt || true
          if [ -s SHA256SUMS.txt ]; then
            echo "SHA256SUMS.txt contents:"
            cat SHA256SUMS.txt
            gh release upload "${RELEASE_TAG}" SHA256SUMS.txt --clobber
            echo "Uploaded SHA256SUMS.txt to release ${RELEASE_TAG}"
          else
            echo "No files to hash — skipping SHA256SUMS.txt upload"
          fi
