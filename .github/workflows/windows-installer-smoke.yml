name: Windows Installer Smoke

on:
  workflow_dispatch:
  schedule:
    - cron: "23 10 * * *"

permissions:
  contents: read

jobs:
  install-uninstall:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download latest installer assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $release = gh release view --json tagName,assets | ConvertFrom-Json
          $installerAsset = $release.assets |
            Where-Object { $_.name -match '^OysterRecorder-[Ss]etup-.*\.exe$' } |
            Select-Object -First 1
          if (-not $installerAsset) {
            throw "Latest release $($release.tagName) has no OysterRecorder setup exe"
          }
          gh release download $release.tagName --pattern $installerAsset.name --dir dist
          gh release download $release.tagName --pattern SHA256SUMS.txt --dir dist
          "INSTALLER_NAME=$($installerAsset.name)" | Out-File -FilePath $env:GITHUB_ENV -Append
          "RELEASE_TAG=$($release.tagName)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Verify checksum
        shell: pwsh
        run: |
          $installer = Join-Path "dist" $env:INSTALLER_NAME
          if (-not (Test-Path $installer)) {
            throw "Installer not downloaded: $installer"
          }
          if (-not (Test-Path "dist\SHA256SUMS.txt")) {
            throw "SHA256SUMS.txt not downloaded"
          }
          $line = Select-String -Path "dist\SHA256SUMS.txt" -Pattern ([regex]::Escape($env:INSTALLER_NAME)) |
            Select-Object -First 1
          if (-not $line) {
            throw "SHA256SUMS.txt does not mention $env:INSTALLER_NAME"
          }
          $expected = ($line.Line -split '\s+')[0].ToLowerInvariant()
          $actual = (Get-FileHash -Algorithm SHA256 -Path $installer).Hash.ToLowerInvariant()
          if ($expected -ne $actual) {
            throw "SHA256 mismatch. expected=$expected actual=$actual"
          }

      - name: Report Authenticode signature
        shell: pwsh
        env:
          REQUIRE_SIGNED_INSTALLER: ${{ vars.REQUIRE_SIGNED_INSTALLER }}
        run: |
          $installer = Join-Path "dist" $env:INSTALLER_NAME
          if (-not (Test-Path $installer)) {
            throw "Installer not downloaded: $installer"
          }

          $signature = Get-AuthenticodeSignature -FilePath $installer
          Write-Host "Authenticode status: $($signature.Status)"
          Write-Host "Authenticode status message: $($signature.StatusMessage)"
          if ($signature.SignerCertificate) {
            Write-Host "Authenticode signer subject: $($signature.SignerCertificate.Subject)"
            Write-Host "Authenticode signer thumbprint: $($signature.SignerCertificate.Thumbprint)"
          } else {
            Write-Host "Authenticode signer subject: <none>"
          }

          if ($env:REQUIRE_SIGNED_INSTALLER -ceq "true" -and $signature.Status -ne "Valid") {
            throw "REQUIRE_SIGNED_INSTALLER=true but Authenticode status is $($signature.Status)"
          }

      - name: Silent install
        shell: pwsh
        run: |
          $installer = Join-Path "dist" $env:INSTALLER_NAME
          $installLog = Join-Path $env:TEMP "OysterRecorder-install.log"
          $args = @(
            "/VERYSILENT",
            "/SUPPRESSMSGBOXES",
            "/NORESTART",
            "/LOG=$installLog"
          )
          $process = Start-Process -FilePath $installer -ArgumentList $args -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            Get-Content $installLog -ErrorAction SilentlyContinue
            throw "Installer exited with $($process.ExitCode)"
          }

      - name: Verify installed files and autostart
        shell: pwsh
        run: |
          $installDir = Join-Path $env:LOCALAPPDATA "OysterRecorder"
          $exe = Join-Path $installDir "gamedata-recorder.exe"
          if (-not (Test-Path $exe)) {
            Get-ChildItem -Recurse -Force $installDir -ErrorAction SilentlyContinue
            throw "Installed recorder exe missing: $exe"
          }
          $run = Get-ItemProperty `
            -Path "HKCU:\Software\Microsoft\Windows\CurrentVersion\Run" `
            -Name "OysterRecorder" `
            -ErrorAction Stop
          if ($run.OysterRecorder -notmatch "gamedata-recorder\.exe" -or $run.OysterRecorder -notmatch "--tray") {
            throw "Unexpected OysterRecorder Run value: $($run.OysterRecorder)"
          }

      - name: Verify OBS runtime dependencies
        shell: pwsh
        run: |
          $installDir = Join-Path $env:LOCALAPPDATA "OysterRecorder"
          $requiredFiles = @(
            "obs.dll",
            "libobs-d3d11.dll",
            "libobs-opengl.dll",
            "libobs-winrt.dll",
            "obs-ffmpeg-mux.exe"
          )
          foreach ($name in $requiredFiles) {
            $path = Join-Path $installDir $name
            if (-not (Test-Path $path)) {
              Get-ChildItem -Recurse -Force $installDir -ErrorAction SilentlyContinue |
                Select-Object -First 200 FullName, Length, LastWriteTime
              throw "OBS runtime dependency missing: $name"
            }
          }

          $requiredDirs = @(
            "obs-plugins",
            "data"
          )
          foreach ($name in $requiredDirs) {
            $path = Join-Path $installDir $name
            if (-not (Test-Path $path -PathType Container)) {
              Get-ChildItem -Recurse -Force $installDir -ErrorAction SilentlyContinue |
                Select-Object -First 200 FullName, Length, LastWriteTime
              throw "OBS runtime directory missing: $name"
            }
          }

      - name: Launch installed recorder in tray mode
        shell: pwsh
        run: |
          $installDir = Join-Path $env:LOCALAPPDATA "OysterRecorder"
          $exe = Join-Path $installDir "gamedata-recorder.exe"
          $launchOutputDir = Join-Path $env:TEMP "OysterRecorder-ci-output"
          New-Item -ItemType Directory -Force -Path $launchOutputDir | Out-Null

          $env:GAMEDATA_CI_MODE = "1"
          $env:GAMEDATA_OUTPUT_DIR = $launchOutputDir
          $env:RUST_BACKTRACE = "1"

          $process = Start-Process `
            -FilePath $exe `
            -ArgumentList @("--tray") `
            -WorkingDirectory $installDir `
            -PassThru

          Start-Sleep -Seconds 12
          if ($process.HasExited) {
            $logCandidates = @(
              (Join-Path $env:APPDATA "GameData Recorder\gamedata-recorder-debug.log"),
              (Join-Path $env:LOCALAPPDATA "GameData Recorder\gamedata-recorder-debug.log")
            )
            foreach ($logPath in $logCandidates) {
              if (Test-Path $logPath) {
                Write-Host "==== $logPath ===="
                Get-Content $logPath -Tail 200 -ErrorAction SilentlyContinue
              }
            }
            throw "Recorder exited during tray launch smoke with code $($process.ExitCode)"
          }

          "RECORDER_PID=$($process.Id)" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "Recorder tray process is running with pid $($process.Id)"

      - name: Silent uninstall
        if: always()
        shell: pwsh
        run: |
          if ($env:RECORDER_PID) {
            Stop-Process -Id ([int]$env:RECORDER_PID) -Force -ErrorAction SilentlyContinue
          }
          Get-Process -Name "gamedata-recorder" -ErrorAction SilentlyContinue |
            Stop-Process -Force -ErrorAction SilentlyContinue

          $installDir = Join-Path $env:LOCALAPPDATA "OysterRecorder"
          $uninstaller = Join-Path $installDir "unins000.exe"
          if (Test-Path $uninstaller) {
            $uninstallLog = Join-Path $env:TEMP "OysterRecorder-uninstall.log"
            $args = @(
              "/VERYSILENT",
              "/SUPPRESSMSGBOXES",
              "/NORESTART",
              "/LOG=$uninstallLog"
            )
            $process = Start-Process -FilePath $uninstaller -ArgumentList $args -Wait -PassThru
            if ($process.ExitCode -ne 0) {
              Get-Content $uninstallLog -ErrorAction SilentlyContinue
              throw "Uninstaller exited with $($process.ExitCode)"
            }
          }
          Remove-ItemProperty `
            -Path "HKCU:\Software\Microsoft\Windows\CurrentVersion\Run" `
            -Name "OysterRecorder" `
            -ErrorAction SilentlyContinue

      - name: Verify uninstall cleanup
        shell: pwsh
        run: |
          $installDir = Join-Path $env:LOCALAPPDATA "OysterRecorder"
          $exe = Join-Path $installDir "gamedata-recorder.exe"
          if (Test-Path $exe) {
            throw "Recorder exe still exists after uninstall: $exe"
          }
          $run = Get-ItemProperty `
            -Path "HKCU:\Software\Microsoft\Windows\CurrentVersion\Run" `
            -Name "OysterRecorder" `
            -ErrorAction SilentlyContinue
          if ($run) {
            throw "OysterRecorder Run value still exists after uninstall"
          }

      - name: Upload smoke logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer-smoke-logs
          path: |
            ${{ runner.temp }}/OysterRecorder-install.log
            ${{ runner.temp }}/OysterRecorder-uninstall.log
            ${{ runner.temp }}/OysterRecorder-ci-output/**
            ~/AppData/Roaming/GameData Recorder/*.log
            ~/AppData/Local/GameData Recorder/*.log
          if-no-files-found: ignore
