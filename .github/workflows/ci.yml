name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # public submodules only; oyster-enrichment is private and the
          # default GITHUB_TOKEN can't clone cross-repo private code.
          # Pipeline tests don't depend on enrichment's internals.
          submodules: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -e .[test,exr,xlsx]

      - name: Run pytest
        run: |
          pytest tests/ -v --tb=short

      - name: Upload coverage
        if: success()
        run: |
          pip install pytest-cov
          pytest tests/ -v --tb=short --cov=. --cov-report=xml
        continue-on-error: true

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run shellcheck
        run: |
          which shellcheck || apt-get update && apt-get install -y shellcheck
          find bin/ -name "*.sh" -exec shellcheck {} +

  lint-buyer-spec:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install package
        run: |
          pip install -e .

      - name: Lint buyer spec
        if: success()
        run: |
          if [ -f samples/buyer-spec-v1-rc1.tar.gz ]; then
            oyster-buyer-lint samples/buyer-spec-v1-rc1.tar.gz
          fi
        continue-on-error: true

  e2e-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run e2e smoke test
        run: |
          bash bin/e2e_smoke.sh --skip-real --skip-obs
        continue-on-error: true
