<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Diamond mine speedrun preview">
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a635f"/>
      <stop offset="100%" stop-color="#082020"/>
    </linearGradient>
    <linearGradient id="lava1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f5b13a"/>
      <stop offset="100%" stop-color="#9b3d12"/>
    </linearGradient>
  </defs>
  <rect width="640" height="360" fill="url(#bg1)"/>
  <!-- Cave silhouettes -->
  <path d="M0,260 L50,220 L120,250 L180,210 L240,240 L300,200 L360,260 L420,230 L480,270 L540,240 L640,260 L640,360 L0,360 Z" fill="#103735"/>
  <path d="M0,290 L80,260 L160,290 L220,250 L320,290 L420,260 L520,290 L640,270 L640,360 L0,360 Z" fill="#0a1817"/>
  <!-- Lava lake -->
  <ellipse cx="320" cy="320" rx="200" ry="20" fill="url(#lava1)" opacity="0.85"/>
  <!-- Torches -->
  <g fill="#f5b13a">
    <rect x="100" y="240" width="3" height="20"/>
    <circle cx="101.5" cy="238" r="6" opacity="0.7"/>
    <rect x="380" y="220" width="3" height="20"/>
    <circle cx="381.5" cy="218" r="6" opacity="0.7"/>
  </g>
  <text x="40" y="60" fill="#aee0db" font-family="ui-sans-serif, system-ui" font-size="14" letter-spacing="2" font-weight="600">[DEV PREVIEW]</text>
  <text x="40" y="100" fill="#eef9f8" font-family="ui-sans-serif, system-ui" font-size="32" font-weight="800">Diamond mine — caves &amp; ravines</text>
  <text x="40" y="125" fill="#7eccc6" font-family="ui-sans-serif, system-ui" font-size="14">3 h 12 min · 3.4 GB · D5 0.93</text>
</svg>
