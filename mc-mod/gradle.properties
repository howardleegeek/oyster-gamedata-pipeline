# =============================================================================
# Oyster Recorder Fabric Mod — gradle.properties
#
# Howard 2026-05-07: this mod closes the last placeholder gap in the recorder
# pipeline. When a human plays Minecraft and uses OysterRecorder.exe, the mod
# streams REAL game state (position, rotation, velocity, dimension) to a JSONL
# file the recorder consumes when packing the buyer-spec tarball. Without the
# mod, action_camera fields stay placeholder; with it, they become REAL.
#
# Versions pinned to the latest STABLE Minecraft + Fabric combo as of 2026-05.
# Bumping these requires re-checking yarn mappings + Fabric API compat.
# =============================================================================

# Minecraft + Fabric versions — defaults for local dev (MC 1.21.4).
# CI injects MC_VERSION env var; build.gradle reads it to override these
# with the correct per-version coordinates from MC_MATRIX.
minecraft_version=1.21.4
yarn_mappings=1.21.4+build.1
loader_version=0.16.14
fabric_version=0.110.0+1.21.4

# Mod identity
mod_version=0.1.0-real-game-state
maven_group=world.oyster
archives_base_name=oyster-recorder-mod

# Java
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
