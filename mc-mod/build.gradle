// =============================================================================
// Oyster Recorder Fabric Mod — build.gradle
//
// Howard 2026-05-07: minimal Fabric mod — no client/server split, no Mixins,
// no rendering hooks. Single ClientModInitializer + ServerModInitializer that
// register tick listeners. JSONL output via plain java.nio. No external
// runtime deps.
//
// Build (default = MC 1.21.4):
//     ./gradlew build  →  build/libs/oyster-recorder-mod-X.Y.Z-mc1.21.4.jar
//
// Build for a different MC version (D19 multi-version matrix):
//     MC_VERSION=1.20.1 ./gradlew build
//     MC_VERSION=1.20.4 ./gradlew build
//     MC_VERSION=1.21.1 ./gradlew build
//
// All four cells produce the SAME Java source compiled against
// version-specific yarn mappings + fabric-api + loader. Source MUST NOT
// diverge — we only depend on stable APIs (ClientTickEvents,
// ServerTickEvents, Player getters) present in all 4 supported versions.
// =============================================================================

plugins {
    id 'fabric-loom' version '1.8-SNAPSHOT'
    id 'maven-publish'
    id 'java'
}

// -----------------------------------------------------------------------------
// D19 multi-version support — single source of truth for per-MC version
// dependencies. Add a row here to support a new MC version.
// -----------------------------------------------------------------------------
// Howard 2026-05-07: fabric-api / yarn / loader versions VERIFIED against
// maven.fabricmc.net via direct HTTP fetch (CodexResearcher agent on
// 2026-05-07). Each coordinate confirmed by reading the actual .jar
// listing in maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/.
// Loader bumped 0.16.9 → 0.16.14 (latest 0.16.x stable, Apr-2025).
// R01 (2026-05-08): expanded from 4 → 9 stable versions.
// Yarn / fabric-api / loader coords verified against meta.fabricmc.net
// and maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/ on 2026-05-08.
ext.MC_MATRIX = [
    "1.20.1": [
        yarn:        "1.20.1+build.10",   // ceiling — +build.11 is 404
        fabricApi:   "0.92.8+1.20.1",     // 15-Apr-2026
        loader:      "0.16.14",
        javaRelease: 17,
        dependsExpr: "~1.20.1",
    ],
    "1.20.2": [
        yarn:        "1.20.2+build.4",    // ceiling — builds 1-4 only; +build.5+ is 404
        fabricApi:   "0.91.6+1.20.2",     // ceiling for 1.20.2; 0.92+ never published for 1.20.2
        loader:      "0.16.14",
        javaRelease: 17,
        dependsExpr: "~1.20.2",
    ],
    "1.20.4": [
        yarn:        "1.20.4+build.3",    // ceiling — +build.4 is 404
        fabricApi:   "0.97.3+1.20.4",     // 20-Jun-2025 ceiling
        loader:      "0.16.14",
        javaRelease: 17,
        dependsExpr: "~1.20.4",
    ],
    "1.20.6": [
        yarn:        "1.20.6+build.1",    // verified 2026-05-08
        fabricApi:   "0.100.8+1.20.6",    // 29-Jul-2024
        loader:      "0.16.14",
        javaRelease: 21,                  // 1.20.6 bumped to Java 21
        dependsExpr: "~1.20.6",
    ],
    "1.21.1": [
        yarn:        "1.21.1+build.3",    // ceiling — +build.4 is 404
        fabricApi:   "0.116.11+1.21.1",   // 15-Apr-2026
        loader:      "0.16.14",
        javaRelease: 21,
        dependsExpr: "~1.21.1",
    ],
    "1.21.2": [
        yarn:        "1.21.2+build.1",    // ceiling — only build.1 exists
        fabricApi:   "0.102.3+1.21.2",    // 21-Aug-2024
        loader:      "0.16.14",
        javaRelease: 21,
        dependsExpr: "~1.21.2",
    ],
    "1.21.3": [
        yarn:        "1.21.3+build.2",    // verified 2026-05-08
        fabricApi:   "0.106.1+1.21.3",    // 23-Oct-2024
        loader:      "0.16.14",
        javaRelease: 21,
        dependsExpr: "~1.21.3",
    ],
    "1.21.4": [
        yarn:        "1.21.4+build.1",
        fabricApi:   "0.110.0+1.21.4",
        loader:      "0.16.14",
        javaRelease: 21,
        dependsExpr: "~1.21.4",
    ],
    "1.21.5": [
        yarn:        "1.21.5+build.1",    // verified 2026-05-08
        fabricApi:   "0.116.1+1.21.5",    // 13-Feb-2025
        loader:      "0.16.14",
        javaRelease: 21,
        dependsExpr: "~1.21.5",
    ],
]

// Pick MC version from env var (set by D19 GHA matrix) or fall back to the
// gradle.properties default (which is the canonical "stable / latest").
def mcVersion = System.getenv("MC_VERSION") ?: project.minecraft_version
def mcEntry = ext.MC_MATRIX[mcVersion]
if (mcEntry == null) {
    throw new GradleException(
        "Unknown MC_VERSION=${mcVersion}. Add an entry to MC_MATRIX in " +
        "build.gradle (current keys: ${ext.MC_MATRIX.keySet()})."
    )
}

println "[D19] Building for Minecraft ${mcVersion} (Java ${mcEntry.javaRelease})"

// Output jar name carries the MC version so a build matrix produces 4
// distinct artifacts: oyster-recorder-mod-X.Y.Z-mc1.21.4.jar etc.
version = "${project.mod_version}-mc${mcVersion}"
group = project.maven_group
base.archivesName = project.archives_base_name

repositories {
    maven { url = 'https://maven.fabricmc.net/' }
    mavenCentral()
}

java {
    // Loom requires Java 21 at BUILD time even when targeting older MC
    // bytecode (1.20 → 17). Source/target stays consistent with the matrix
    // row's javaRelease so the .jar runs on the right MC's bundled JVM.
    sourceCompatibility = JavaVersion.toVersion(mcEntry.javaRelease)
    targetCompatibility = JavaVersion.toVersion(mcEntry.javaRelease)
    withSourcesJar()
}

dependencies {
    minecraft "com.mojang:minecraft:${mcVersion}"
    mappings "net.fabricmc:yarn:${mcEntry.yarn}:v2"
    modImplementation "net.fabricmc:fabric-loader:${mcEntry.loader}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${mcEntry.fabricApi}"
}

processResources {
    inputs.property "version", project.version
    inputs.property "mc_depends", mcEntry.dependsExpr
    filesMatching("fabric.mod.json") {
        expand(
            "version": project.version,
            "mc_depends": mcEntry.dependsExpr,
        )
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = mcEntry.javaRelease
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archivesBaseName}" }
    }
}
