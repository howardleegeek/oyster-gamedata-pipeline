[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "oyster-agent-runner"
version = "0.1.0"
description = "Oyster Labs Layer 4 — LLM-agent-driven gameplay data generation in mod-friendly games."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [
    { name = "Oyster Labs", email = "howard.li@berkeley.edu" },
]
keywords = ["world-models", "agent", "minecraft", "factorio", "llm", "gameplay-data"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
]

dependencies = [
    "pydantic>=2.5",
    "typer>=0.12",
    "rich>=13.0",
    "anthropic>=0.40",
    "openai>=1.40",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "black>=24.0",
]
test = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "numpy>=1.26",
    "openpyxl>=3.1",
    "Pillow>=10.0",  # PIL — required by tests/bin/test_real_depth_filler.py
    "PyYAML>=6.0",   # YAML — required by tests/test_web_workflows.py (Vercel deploy contract)
    "cryptography>=42.0",  # ed25519 — required by bin/provenance_sign.py + provenance_verify.py (B2)
]
exr = ["OpenEXR>=3.0", "numpy>=1.26"]
xlsx = ["openpyxl>=3.1"]
cs2 = ["demoparser2>=0.41"]
beamng = ["beamngpy>=1.27"]

[project.scripts]
oyster-agent = "oyster_agent_runner.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/oyster_agent_runner"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Add repo-root + src/ to sys.path so both `from bin.X import Y` (top-level
# scripts dir, marked as package via __init__.py) and `from oyster_agent_runner
# import ...` (proper Python package under src/) work without an editable
# install. Without `src`, 20+ tests error with ModuleNotFoundError at
# collection time even when the package directory is right there.
pythonpath = [".", "src"]
addopts = "-ra --strict-markers"
markers = [
    "unit: fast isolated tests",
    "integration: tests that touch the filesystem or mock external services",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]  # core: error / pyflakes / warning / isort
# Ignore high-volume style-only lints in alpha; ratchet stricter post-MVP
ignore = [
    "E501",  # line length — black handles it
    "E402",  # module-level imports not at top — intentional for sys.path setup in tests/scripts
    "E712",  # comparison-to-True/False — explicit is fine for predicate filters
    "W293",  # blank line whitespace — cosmetic
    "F841",  # unused local — sometimes intentional for exception capture
]
# Drop B / UP / SIM / N from select for now; those are 1100+ fixes worth of
# refactoring that doesn't change correctness. Re-add post-buyer-signoff.

[tool.black]
line-length = 100
target-version = ["py311"]

# ISC-PROD-1 (2026-05-04) — strict typing for production-grade buyer-spec code
[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_return_any = true
warn_unreachable = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
strict_equality = true
explicit_package_bases = true
namespace_packages = true
mypy_path = "src"
files = ["src/oyster_agent_runner"]

# Tolerant of optional deps that may not be installed in some envs
[[tool.mypy.overrides]]
module = ["OpenEXR", "Imath", "openpyxl.*", "demoparser2", "beamngpy", "numpy.*"]
ignore_missing_imports = true
