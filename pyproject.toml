[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "oyster-agent-runner"
version = "0.1.0"
description = "Oyster Labs Layer 4 — LLM-agent-driven gameplay data generation in mod-friendly games."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [
    { name = "Oyster Labs", email = "howard.li@berkeley.edu" },
]
keywords = ["world-models", "agent", "minecraft", "factorio", "llm", "gameplay-data"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
]

dependencies = [
    "pydantic>=2.5",
    "typer>=0.12",
    "rich>=13.0",
    "anthropic>=0.40",
    "openai>=1.40",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "black>=24.0",
]
test = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "numpy>=1.26",
    "openpyxl>=3.1",
]
exr = ["OpenEXR>=3.0", "numpy>=1.26"]
xlsx = ["openpyxl>=3.1"]
cs2 = ["demoparser2>=0.41"]
beamng = ["beamngpy>=1.27"]

[project.scripts]
oyster-agent = "oyster_agent_runner.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/oyster_agent_runner"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "unit: fast isolated tests",
    "integration: tests that touch the filesystem or mock external services",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "N"]
ignore = ["E501"]  # black handles line length

[tool.black]
line-length = 100
target-version = ["py311"]
